name: fnbposai-db-pg-replica-service

services:
  fnbposai-db-pg-replica:
    image: postgres:18
    container_name: fnbposai-db-pg-replica
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: fnbposai-db-pg-primary
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      - ./replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
      - fnbposai-db-pg-replica-volume:/var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/usr/local/bin/replica-entrypoint.sh"]
    command: ["postgres", "-c", "hot_standby=on"]
    networks:
      - docker0
    restart: never # always | unless-stopped | never

volumes:
  fnbposai-db-pg-replica-volume:

networks:
  docker0:
    external: true
