# PostgreSQL replica of the account service.
#
# The replica runs hot standby and applies the stream of the primary. It serves
# read only queries, so a reporting or export job never touches the primary.
#
# The file is mounted read only at /etc/postgresql/postgresql.conf.

listen_addresses = '*'
port = 5432
max_connections = 100

# Standby behaviour.
hot_standby = on
hot_standby_feedback = on
max_standby_streaming_delay = 30s
max_standby_archive_delay = 60s

# Memory. The replica holds the same cache budget as the primary.
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Recovery. A read only transaction may wait for one WAL segment, never longer.
recovery_min_apply_delay = 0
wal_receiver_timeout = 60s

# Parallel query.
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2

# Timeouts.
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s

# Logging.
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
