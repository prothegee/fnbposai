# PostgreSQL primary of the account service.
#
# Only the settings that differ from the image default are listed. The file is
# mounted read only at /etc/postgresql/postgresql.conf and the container starts
# postgres with config_file pointing at it.
#
# Tuning target: a developer machine with one tenant workload. Raise
# shared_buffers, work_mem, and max_worker_processes from the environment when a
# deployment needs more headroom.

listen_addresses = '*'
port = 5432
max_connections = 100

# Replication, so postgres-replica can stream and replay.
wal_level = replica
max_wal_senders = 10
wal_keep_size = 512MB
hot_standby = on

# Memory. shared_buffers is a quarter of the 1 GB container budget.
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Checkpoints. Spread the write cost so a sign in never waits on one big flush.
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
max_wal_size = 2GB
min_wal_size = 256MB

# Parallel query. The account workload is small, so the fan out stays modest.
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Timeouts. A stuck statement must not hold a lock the sign up path needs.
statement_timeout = 30s
idle_in_transaction_session_timeout = 60s
lock_timeout = 10s

# Logging. Slow queries are logged so a regression is visible in local dev.
log_min_duration_statement = 250ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
