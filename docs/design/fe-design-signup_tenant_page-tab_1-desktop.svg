<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.08"/>
    </filter>
    <filter id="snackShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="orbGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="brandClip">
      <path d="M 330 140 L 690 140 L 690 800 L 330 800 A 20 20 0 0 1 310 780 L 310 160 A 20 20 0 0 1 330 140 Z"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8fafc"/>
  <circle cx="140" cy="160" r="220" fill="#e0edff" opacity="0.5"/>
  <circle cx="1330" cy="760" r="240" fill="#ede9fe" opacity="0.45"/>
  <circle cx="1350" cy="120" r="160" fill="#dbeafe" opacity="0.35"/>

  <!-- SNACKBAR -->
  <g filter="url(#snackShadow)">
    <rect x="520" y="24" width="400" height="44" rx="22" fill="#0f172a"/>
  </g>
  <circle cx="548" cy="46" r="11" fill="#22c55e"/>
  <path d="M543 46 L547 50 L554 42" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="570" y="51" font-size="12.5" font-weight="500" fill="#ffffff">Tenant created. Check your inbox to verify.</text>

  <!-- CARD -->
  <rect x="310" y="140" width="820" height="660" rx="20" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- BRAND PANEL -->
  <g clip-path="url(#brandClip)">
    <rect x="310" y="140" width="380" height="660" fill="url(#brandGrad)"/>
    <circle cx="500" cy="220" r="150" fill="url(#orbGrad)"/>
    <circle cx="580" cy="680" r="120" fill="url(#orbGrad)"/>
    <circle cx="360" cy="740" r="90" fill="url(#orbGrad)"/>
  </g>

  <!-- Chip -->
  <rect x="346" y="180" width="120" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
  <text x="406" y="198" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">FNB POS</text>

  <!-- Headline -->
  <text x="346" y="286" font-size="28" font-weight="700" fill="#ffffff">Register your café</text>
  <text x="346" y="320" font-size="28" font-weight="700" fill="#ffffff">in just two steps.</text>

  <!-- Subtext -->
  <text x="346" y="352" font-size="12.5" fill="#dbeafe" opacity="0.9">Tell us about your business and</text>
  <text x="346" y="370" font-size="12.5" fill="#dbeafe" opacity="0.9">your first branch to get started.</text>

  <!-- Bullets -->
  <circle cx="354" cy="420" r="10" fill="#ffffff" opacity="0.16"/>
  <path d="M349 420 L353 424 L359 416" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="374" y="424" font-size="12.5" fill="#ffffff">Free 14-day trial</text>

  <circle cx="354" cy="454" r="10" fill="#ffffff" opacity="0.16"/>
  <path d="M349 454 L353 458 L359 450" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="374" y="458" font-size="12.5" fill="#ffffff">No credit card required</text>

  <circle cx="354" cy="488" r="10" fill="#ffffff" opacity="0.16"/>
  <path d="M349 488 L353 492 L359 484" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="374" y="492" font-size="12.5" fill="#ffffff">Cancel anytime</text>

  <!-- Mini illustration -->
  <rect x="346" y="536" width="300" height="140" rx="14" fill="#ffffff" opacity="0.12"/>
  <rect x="346" y="536" width="300" height="140" rx="14" fill="none" stroke="#ffffff" opacity="0.2"/>
  <text x="366" y="570" font-size="9" font-weight="600" fill="#ffffff" opacity="0.7" letter-spacing="0.4">TENANT</text>
  <rect x="366" y="578" width="140" height="8" rx="4" fill="#ffffff" opacity="0.55"/>
  <text x="366" y="606" font-size="9" font-weight="600" fill="#ffffff" opacity="0.7" letter-spacing="0.4">BRANCH</text>
  <rect x="366" y="614" width="170" height="8" rx="4" fill="#ffffff" opacity="0.4"/>
  <rect x="366" y="638" width="90" height="20" rx="6" fill="#ffffff" opacity="0.28"/>
  <rect x="464" y="638" width="54" height="20" rx="6" fill="#ffffff" opacity="0.18"/>
  <circle cx="600" cy="590" r="22" fill="none" stroke="#ffffff" opacity="0.4" stroke-width="3"/>
  <path d="M586 590 L596 600 L616 578" fill="none" stroke="#ffffff" opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Caption -->
  <text x="346" y="746" font-size="10.5" fill="#dbeafe" opacity="0.75">Join 200+ independent cafés</text>

  <!-- ============ RIGHT PANEL : FORM ============ -->
  <!-- Logo mark -->
  <rect x="728" y="172" width="42" height="42" rx="11" fill="#e0edff" stroke="#bfdbfe"/>
  <circle cx="749" cy="193" r="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M744 193 L748 197 L754 190" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Headings -->
  <text x="728" y="248" font-size="22" font-weight="700" fill="#0f172a">Register your tenant</text>
  <text x="728" y="270" font-size="12.5" fill="#64748b">Set up your business and first branch.</text>

  <!-- EMAIL (focused) -->
  <rect x="728" y="294" width="360" height="46" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="748" y="311" font-size="10" font-weight="600" fill="#2563eb" letter-spacing="0.4">EMAIL ADDRESS</text>
  <text x="748" y="328" font-size="13" fill="#0f172a">owner@sunrisecafe.id</text>

  <!-- PASSWORD (filled) -->
  <rect x="728" y="348" width="360" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="748" y="365" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">PASSWORD</text>
  <text x="748" y="382" font-size="13" fill="#0f172a">••••••••••</text>
  <circle cx="1056" cy="371" r="14" fill="transparent"/>
  <path d="M1048 371 Q1056 362 1064 371 Q1056 380 1048 371 Z" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="1056" cy="371" r="2.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- VERIFY PASSWORD (filled, matching) -->
  <rect x="728" y="402" width="360" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="748" y="419" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">VERIFY PASSWORD</text>
  <text x="748" y="436" font-size="13" fill="#0f172a">••••••••••</text>
  <circle cx="1056" cy="425" r="11" fill="#f0fdf4"/>
  <path d="M1050 425 L1055 430 L1062 421" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- TENANT NAME -->
  <rect x="728" y="456" width="360" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="748" y="473" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">TENANT NAME</text>
  <text x="748" y="490" font-size="13" fill="#0f172a">Sunrise Café</text>

  <!-- BRANCH NAME -->
  <rect x="728" y="510" width="360" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="748" y="527" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">BRANCH NAME</text>
  <text x="748" y="544" font-size="13" fill="#0f172a">Downtown Branch</text>

  <!-- TERMS -->
  <rect x="728" y="570" width="16" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="754" y="583" font-size="12" fill="#334155">
    I agree to the <tspan font-weight="600" fill="#2563eb">Terms of Service</tspan> and <tspan font-weight="600" fill="#2563eb">Privacy Policy</tspan>.
  </text>

  <!-- CREATE TENANT BUTTON -->
  <rect x="728" y="598" width="360" height="42" rx="10" fill="#2563eb"/>
  <text x="908" y="623" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Create Tenant</text>

  <!-- DIVIDER -->
  <line x1="728" y1="664" x2="880" y2="664" stroke="#e2e8f0" stroke-width="1"/>
  <text x="908" y="668" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="middle">OR</text>
  <line x1="936" y1="664" x2="1088" y2="664" stroke="#e2e8f0" stroke-width="1"/>

  <!-- SIGN IN LINK -->
  <text x="908" y="696" font-size="12.5" fill="#64748b" text-anchor="middle">
    Already have an account? <tspan font-weight="600" fill="#2563eb">Sign In</tspan>
  </text>

  <!-- REGISTER AS USER BUTTON -->
  <rect x="788" y="712" width="240" height="32" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="898" y="732" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Register as User</text>
  <path d="M1012 728 L1018 728 M1015 724 L1019 728 L1015 732" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- FOOTER -->
  <text x="908" y="770" font-size="10.5" fill="#94a3b8" text-anchor="middle">Your data is encrypted and never shared with third parties.</text>
</svg>
