<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.04"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="1390" cy="40" r="20"/></clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8fafc"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="80" fill="#ffffff"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tenant logo -->
  <rect x="20" y="20" width="44" height="44" rx="10" fill="#e0edff" stroke="#bfdbfe"/>
  <circle cx="33" cy="32" r="3.2" fill="#93c5fd"/>
  <path d="M28 54 L37 43 L43 50 L47 45 L56 54 Z" fill="#93c5fd"/>

  <!-- split -->
  <line x1="78" y1="22" x2="78" y2="58" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Tenant name + branch selector -->
  <text x="94" y="38" font-size="15" font-weight="600" fill="#0f172a">Sunrise Café</text>
  <rect x="94" y="46" width="168" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="107" y="62" font-size="11.5" fill="#475569">Downtown Branch</text>
  <text x="246" y="63" font-size="10" fill="#64748b">▾</text>

  <!-- Right group : user -->
  <text x="1340" y="36" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">jdoe</text>
  <text x="1340" y="53" font-size="10.5" fill="#64748b" text-anchor="end">Cashier</text>
  <line x1="1352" y1="22" x2="1352" y2="58" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="1390" cy="40" r="20" fill="#e2e8f0" stroke="#cbd5e1"/>
  <g clip-path="url(#avatarClip)">
    <circle cx="1390" cy="34" r="7" fill="#94a3b8"/>
    <circle cx="1390" cy="59" r="14" fill="#94a3b8"/>
  </g>

  <!-- ============ LEFT SIDEBAR ============ -->
  <rect x="0" y="80" width="210" height="820" fill="#ffffff"/>
  <line x1="210" y1="80" x2="210" y2="900" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="104" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.2">MENU</text>
  <circle cx="188" cy="100" r="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="188" y="104" font-size="10" fill="#64748b" text-anchor="middle">«</text>

  <!-- Items -->
  <rect x="20" y="132" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="1.7" fill="#94a3b8"/>
  <circle cx="32" cy="138" r="1.7" fill="#94a3b8"/>
  <circle cx="26" cy="144" r="1.7" fill="#94a3b8"/>
  <circle cx="32" cy="144" r="1.7" fill="#94a3b8"/>
  <text x="50" y="145" font-size="12.5" fill="#334155">Items</text>

  <!-- Order -->
  <rect x="20" y="178" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="183" x2="34" y2="183" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="187" x2="34" y2="187" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="191" x2="30" y2="191" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="191" font-size="12.5" fill="#334155">Order</text>

  <!-- Sales -->
  <rect x="20" y="224" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="25" y1="239" x2="25" y2="233" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="239" x2="30" y2="228" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="239" x2="35" y2="231" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="237" font-size="12.5" fill="#334155">Sales</text>

  <!-- Tenant (Active) -->
  <rect x="12" y="250" width="186" height="32" rx="8" fill="#eff6ff"/>
  <rect x="20" y="257" width="18" height="18" rx="5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M23 266 L29 260 L35 266" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="25" y="266" width="8" height="7" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <text x="50" y="270" font-size="12.5" font-weight="600" fill="#2563eb">Tenant</text>

  <!-- Stocks -->
  <rect x="20" y="300" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="306" width="10" height="9" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="24" y1="310" x2="34" y2="310" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="50" y="313" font-size="12.5" fill="#334155">Stocks</text>

  <!-- Monitor -->
  <rect x="20" y="346" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="350" width="10" height="8" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="29" y1="358" x2="29" y2="361" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="26" y1="362" x2="32" y2="362" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="359" font-size="12.5" fill="#334155">Monitor</text>
  <text x="188" y="360" font-size="9" fill="#64748b" text-anchor="middle">▾</text>

  <!-- Monitor sub item -->
  <line x1="32" y1="378" x2="32" y2="424" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="32" cy="398" r="3" fill="#cbd5e1"/>
  <text x="46" y="395" font-size="12" fill="#475569">Orders in &amp; out</text>
  <text x="46" y="411" font-size="9.5" fill="#94a3b8">Kitchen &amp; Bar</text>

  <!-- Sign out -->
  <line x1="16" y1="820" x2="194" y2="820" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="841" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M30 845 L30 855 M30 845 L36 845 M30 855 L36 855 M33 850 L38 850" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="854" font-size="12.5" fill="#334155">Sign out</text>

  <!-- ============ MAIN CONTENT AREA ============ -->
  <rect x="210" y="80" width="1230" height="820" fill="#f8fafc"/>

  <!-- ============ TAB BAR ============ -->
  <rect x="230" y="100" width="1190" height="40" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tab 1: Tenant Info -->
  <rect x="240" y="108" width="110" height="24" rx="6" fill="#f1f5f9"/>
  <text x="295" y="124" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Tenant Info</text>

  <!-- Tab 2: Branch Info (Active) -->
  <rect x="360" y="108" width="110" height="24" rx="6" fill="#eff6ff"/>
  <text x="415" y="124" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle">Branch Info</text>
  <line x1="360" y1="132" x2="470" y2="132" stroke="#2563eb" stroke-width="2"/>

  <!-- Tab 3: Tax Info -->
  <rect x="480" y="108" width="100" height="24" rx="6" fill="#f1f5f9"/>
  <text x="530" y="124" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Tax Info</text>

  <!-- Tab 4: Members -->
  <rect x="590" y="108" width="90" height="24" rx="6" fill="#f1f5f9"/>
  <text x="635" y="124" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Members</text>

  <!-- ============ PAGE HEADER ============ -->
  <text x="230" y="185" font-size="18" font-weight="700" fill="#0f172a">Branch Information</text>
  <text x="230" y="205" font-size="12" fill="#64748b">Manage branch-level details. This only affects the currently selected branch.</text>

  <!-- Editable badge -->
  <rect x="1280" y="170" width="140" height="26" rx="13" fill="#f0fdf4"/>
  <circle cx="1298" cy="183" r="3.5" fill="#16a34a"/>
  <text x="1310" y="187" font-size="11" font-weight="600" fill="#16a34a">Editable</text>

  <!-- ============ FORM CARD ============ -->
  <rect x="230" y="220" width="1190" height="620" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== SECTION 1 : BRANCH DETAILS ===== -->
  <text x="270" y="262" font-size="13" font-weight="700" fill="#0f172a">Branch Details</text>
  <line x1="270" y1="278" x2="1380" y2="278" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Branch avatar / photo -->
  <rect x="270" y="300" width="100" height="100" rx="12" fill="#eef2f7" stroke="#e2e8f0"/>
  <circle cx="304" cy="330" r="6" fill="#cbd5e1"/>
  <path d="M270 388 L310 348 L332 370 L352 350 L370 368 L370 400 L270 400 Z" fill="#cbd5e1"/>

  <!-- Upload button -->
  <rect x="270" y="412" width="100" height="30" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="432" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Upload</text>

  <!-- Helper text -->
  <text x="320" y="462" font-size="10" fill="#94a3b8" text-anchor="middle">PNG, JPG · max 2MB</text>

  <!-- Right-side fields -->
  <text x="410" y="304" font-size="11" font-weight="600" fill="#64748b">BRANCH NAME</text>
  <rect x="410" y="312" width="470" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="426" y="336" font-size="12.5" fill="#0f172a">Downtown Branch</text>

  <text x="910" y="304" font-size="11" font-weight="600" fill="#64748b">BRANCH CODE</text>
  <rect x="910" y="312" width="470" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="926" y="336" font-size="12.5" fill="#0f172a">SC-DT-01</text>

  <text x="410" y="374" font-size="11" font-weight="600" fill="#64748b">BRANCH MANAGER</text>
  <rect x="410" y="382" width="470" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="426" y="406" font-size="12.5" fill="#0f172a">Sarah M.</text>

  <text x="910" y="374" font-size="11" font-weight="600" fill="#64748b">OPERATIONAL STATUS</text>
  <rect x="910" y="382" width="470" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="930" cy="401" r="4" fill="#22c55e"/>
  <text x="942" y="406" font-size="12.5" fill="#0f172a">Active — Accepting orders</text>
  <text x="1364" y="406" font-size="10" fill="#64748b">▾</text>

  <text x="410" y="444" font-size="11" font-weight="600" fill="#64748b">OPERATING HOURS</text>
  <rect x="410" y="452" width="470" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="426" y="476" font-size="12.5" fill="#0f172a">08:00 AM — 10:00 PM</text>

  <text x="910" y="444" font-size="11" font-weight="600" fill="#64748b">TIMEZONE</text>
  <rect x="910" y="452" width="470" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="926" y="476" font-size="12.5" fill="#0f172a">Asia/Jakarta (GMT+7)</text>
  <text x="1364" y="476" font-size="10" fill="#64748b">▾</text>

  <text x="410" y="514" font-size="11" font-weight="600" fill="#64748b">DESCRIPTION</text>
  <rect x="410" y="522" width="970" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="426" y="546" font-size="12.5" fill="#0f172a">Main flagship branch located in the central business district.</text>
  <text x="426" y="566" font-size="12.5" fill="#64748b">Seats 48 guests · Includes dedicated barista bar and pastry counter.</text>

  <!-- ===== SECTION 2 : BRANCH CONTACT & ADDRESS ===== -->
  <text x="270" y="606" font-size="13" font-weight="700" fill="#0f172a">Branch Contact &amp; Address</text>
  <line x1="270" y1="596" x2="1380" y2="596" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Row 1: Email / Phone -->
  <text x="270" y="624" font-size="11" font-weight="600" fill="#64748b">BRANCH EMAIL</text>
  <rect x="270" y="632" width="540" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="286" y="656" font-size="12.5" fill="#0f172a">downtown@sunrisecafe.id</text>

  <text x="830" y="624" font-size="11" font-weight="600" fill="#64748b">BRANCH PHONE</text>
  <rect x="830" y="632" width="540" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="846" y="656" font-size="12.5" fill="#0f172a">+62 812 9988 7766</text>

  <!-- Row 2: Street -->
  <text x="270" y="686" font-size="11" font-weight="600" fill="#64748b">STREET ADDRESS</text>
  <rect x="270" y="694" width="1100" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="286" y="718" font-size="12.5" fill="#0f172a">Jl. Sudirman No. 88, Kel. Karet, Kec. Setiabudi</text>

  <!-- Row 3: City / State / ZIP -->
  <text x="270" y="748" font-size="11" font-weight="600" fill="#64748b">CITY</text>
  <rect x="270" y="756" width="350" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="286" y="780" font-size="12.5" fill="#0f172a">Jakarta Selatan</text>

  <text x="640" y="748" font-size="11" font-weight="600" fill="#64748b">STATE / PROVINCE</text>
  <rect x="640" y="756" width="350" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="656" y="780" font-size="12.5" fill="#0f172a">DKI Jakarta</text>

  <text x="1010" y="748" font-size="11" font-weight="600" fill="#64748b">ZIP / POSTAL</text>
  <rect x="1010" y="756" width="360" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1026" y="780" font-size="12.5" fill="#0f172a">12950</text>

  <!-- ============ STICKY FOOTER (inside card) ============ -->
  <line x1="230" y1="840" x2="1420" y2="840" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Cancel -->
  <rect x="1130" y="858" width="110" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1185" y="881" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

  <!-- Save Changes -->
  <rect x="1250" y="858" width="130" height="36" rx="8" fill="#2563eb"/>
  <text x="1315" y="881" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save Changes</text>

  <!-- ============ SCROLLBAR ============ -->
  <!-- Track -->
  <rect x="1408" y="240" width="6" height="584" rx="3" fill="#f1f5f9"/>
  <!-- Thumb -->
  <rect x="1408" y="240" width="6" height="300" rx="3" fill="#cbd5e1"/>
</svg>
