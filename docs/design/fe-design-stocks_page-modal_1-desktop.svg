<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#0f172a" opacity="0.5"/>

  <!-- Modal — taller, ends at y=900 -->
  <rect x="420" y="30" width="600" height="870" rx="16" fill="#ffffff" filter="url(#modalShadow)"/>

  <!-- HEADER -->
  <circle cx="464" cy="68" r="16" fill="#eff6ff"/>
  <path d="M457 73 L464 66 L471 73 L464 80 Z" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M462 68 L466 72" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>
  <text x="496" y="66" font-size="17" font-weight="700" fill="#0f172a">Edit Stock</text>
  <text x="496" y="86" font-size="11.5" fill="#64748b">Espresso Beans · Coffee</text>
  <circle cx="984" cy="68" r="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="984" y="72" font-size="11" fill="#64748b" text-anchor="middle">✕</text>

  <line x1="420" y1="110" x2="1020" y2="110" stroke="#e2e8f0" stroke-width="1"/>

  <!-- SECTION 1 : BASIC -->
  <text x="460" y="138" font-size="12.5" font-weight="700" fill="#0f172a">Basic Information</text>
  <line x1="460" y1="152" x2="980" y2="152" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Thumbnail -->
  <rect x="460" y="165" width="90" height="90" rx="10" fill="#eef2f7" stroke="#e2e8f0"/>
  <rect x="485" y="195" width="40" height="34" rx="4" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="485" y1="208" x2="525" y2="208" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="460" y="265" width="90" height="26" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="282" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">Browse…</text>

  <rect x="460" y="295" width="90" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="505" y="312" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Remove</text>

  <text x="505" y="342" font-size="9.5" fill="#94a3b8" text-anchor="middle">PNG, JPG · max 2MB</text>

  <!-- Name -->
  <text x="580" y="165" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">STOCK NAME <tspan fill="#dc2626">*</tspan></text>
  <rect x="580" y="173" width="400" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="596" y="196" font-size="12.5" fill="#0f172a">Espresso Beans</text>

  <!-- Category -->
  <text x="580" y="225" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">CATEGORY</text>
  <rect x="580" y="233" width="400" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="256" font-size="12.5" fill="#0f172a">Coffee</text>
  <text x="962" y="256" font-size="10" fill="#64748b">▾</text>

  <!-- Quantity / Warning -->
  <text x="580" y="285" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">QUANTITY</text>
  <rect x="580" y="293" width="190" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="316" font-size="12.5" fill="#0f172a">24</text>

  <text x="790" y="285" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">WARNING QTY</text>
  <rect x="790" y="293" width="190" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="806" y="316" font-size="12.5" fill="#0f172a">10</text>

  <!-- Tags -->
  <text x="580" y="345" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">TAGS</text>
  <text x="618" y="345" font-size="9" fill="#94a3b8">· up to 6</text>
  <rect x="580" y="353" width="400" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="592" y="358" width="58" height="24" rx="12" fill="#eff6ff"/>
  <text x="621" y="374" font-size="11" fill="#2563eb" text-anchor="middle">coffee</text>
  <rect x="658" y="358" width="42" height="24" rx="12" fill="#eff6ff"/>
  <text x="679" y="374" font-size="11" fill="#2563eb" text-anchor="middle">raw</text>
  <text x="712" y="374" font-size="11" fill="#94a3b8">add more…</text>

  <!-- SECTION 2 : WEIGHT -->
  <text x="460" y="415" font-size="12.5" font-weight="700" fill="#0f172a">Weight &amp; Deduct</text>
  <line x1="460" y1="429" x2="980" y2="429" stroke="#f1f5f9" stroke-width="1"/>

  <text x="460" y="453" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">WEIGHT PER UNIT</text>
  <rect x="460" y="461" width="250" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="484" font-size="12.5" fill="#0f172a">1.00</text>

  <text x="730" y="453" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">WEIGHT UNIT</text>
  <rect x="730" y="461" width="250" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="746" y="484" font-size="12.5" fill="#0f172a">kg</text>
  <text x="962" y="484" font-size="10" fill="#64748b">▾</text>

  <text x="460" y="513" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">WEIGHT DEDUCT <tspan font-weight="500" fill="#94a3b8">(auto)</tspan></text>
  <rect x="460" y="521" width="520" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="476" y="544" font-size="12.5" font-weight="600" fill="#64748b">24.00</text>
  <text x="962" y="544" font-size="11" fill="#94a3b8" text-anchor="end">kg</text>
  <text x="460" y="572" font-size="9.5" fill="#94a3b8" font-style="italic">Auto-calculated: quantity × weight per unit. Must stay below total weight.</text>

  <rect x="460" y="586" width="520" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="476" y="603" font-size="11.5" font-weight="500" fill="#0f172a">Out of stock</text>
  <text x="476" y="617" font-size="9" fill="#64748b">Hide linked items if auto-OOO is enabled on them</text>
  <rect x="936" y="594" width="36" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="948" cy="604" r="7" fill="#ffffff"/>

  <!-- SECTION 3 : DESCRIPTION & EXTRA INFO -->
  <text x="460" y="660" font-size="12.5" font-weight="700" fill="#0f172a">Description &amp; Extra Info</text>
  <line x1="460" y1="674" x2="980" y2="674" stroke="#f1f5f9" stroke-width="1"/>

  <text x="460" y="694" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">DESCRIPTION</text>
  <rect x="460" y="702" width="520" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="722" font-size="12" fill="#0f172a">Dark roast beans sourced from single-origin farms,</text>
  <text x="476" y="740" font-size="12" fill="#0f172a">ideal for espresso and milk-based drinks.</text>

  <text x="460" y="776" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">EXTRA INFO</text>
  <rect x="460" y="784" width="520" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="805" font-size="12" fill="#94a3b8">Supplier notes, storage instructions, etc.</text>

  <!-- FOOTER -->
  <line x1="420" y1="836" x2="1020" y2="836" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="744" y="852" width="100" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="794" y="876" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

  <rect x="854" y="852" width="126" height="38" rx="10" fill="#2563eb"/>
  <text x="917" y="876" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Save Changes</text>
</svg>
