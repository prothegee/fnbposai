<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dim backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#0f172a" opacity="0.5"/>

  <!-- Modal -->
  <rect x="420" y="50" width="600" height="760" rx="16" fill="#ffffff" filter="url(#modalShadow)"/>

  <!-- ================= HEADER ================= -->
  <circle cx="464" cy="88" r="16" fill="#eff6ff"/>
  <path d="M457 83 L462 80 L470 88 L474 84 L477 87 L470 94 Z" fill="#2563eb"/>
  <text x="496" y="86" font-size="17" font-weight="700" fill="#0f172a">Edit Item</text>
  <text x="496" y="106" font-size="11.5" fill="#64748b">Cappuccino · Coffee</text>
  <circle cx="984" cy="88" r="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="984" y="92" font-size="11" fill="#64748b" text-anchor="middle">✕</text>

  <line x1="420" y1="130" x2="1020" y2="130" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= SECTION 1 : BASIC INFORMATION ================= -->
  <text x="460" y="158" font-size="12.5" font-weight="700" fill="#0f172a">Basic Information</text>
  <line x1="460" y1="172" x2="980" y2="172" stroke="#f1f5f9" stroke-width="1"/>

  <rect x="460" y="185" width="90" height="90" rx="10" fill="#eef2f7" stroke="#e2e8f0"/>
  <circle cx="490" cy="215" r="5" fill="#cbd5e1"/>
  <path d="M460 268 L490 238 L508 256 L524 240 L550 262 L550 275 L460 275 Z" fill="#cbd5e1"/>

  <rect x="460" y="285" width="90" height="26" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="505" y="302" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">Browse…</text>

  <rect x="460" y="315" width="90" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="505" y="332" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Remove</text>

  <text x="505" y="362" font-size="9.5" fill="#94a3b8" text-anchor="middle">PNG, JPG · max 2MB</text>

  <text x="580" y="185" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">ITEM NAME <tspan fill="#dc2626">*</tspan></text>
  <rect x="580" y="193" width="400" height="36" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="596" y="216" font-size="12.5" fill="#0f172a">Cappuccino</text>

  <text x="580" y="245" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">CATEGORY</text>
  <rect x="580" y="253" width="400" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="276" font-size="12.5" fill="#0f172a">Coffee</text>
  <text x="962" y="276" font-size="10" fill="#64748b">▾</text>

  <text x="580" y="305" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">PRICE</text>
  <rect x="580" y="313" width="190" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="336" font-size="12.5" fill="#0f172a">3.50</text>

  <text x="790" y="305" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">CURRENCY</text>
  <rect x="790" y="313" width="190" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="806" y="336" font-size="12.5" fill="#0f172a">USD</text>
  <text x="962" y="336" font-size="10" fill="#64748b">▾</text>

  <text x="580" y="365" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">WEIGHT</text>
  <rect x="580" y="373" width="190" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="596" y="396" font-size="12.5" fill="#0f172a">350</text>

  <text x="790" y="365" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">WEIGHT UNIT</text>
  <rect x="790" y="373" width="190" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="806" y="396" font-size="12.5" fill="#0f172a">g</text>
  <text x="962" y="396" font-size="10" fill="#64748b">▾</text>

  <text x="580" y="425" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.4">TAGS</text>
  <text x="618" y="425" font-size="9" fill="#94a3b8">· up to 6</text>
  <rect x="580" y="433" width="400" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="592" y="438" width="58" height="24" rx="12" fill="#eff6ff"/>
  <text x="621" y="454" font-size="11" fill="#2563eb" text-anchor="middle">coffee</text>
  <rect x="658" y="438" width="42" height="24" rx="12" fill="#eff6ff"/>
  <text x="679" y="454" font-size="11" fill="#2563eb" text-anchor="middle">hot</text>
  <rect x="708" y="438" width="76" height="24" rx="12" fill="#eff6ff"/>
  <text x="746" y="454" font-size="11" fill="#2563eb" text-anchor="middle">signature</text>
  <text x="798" y="454" font-size="11" fill="#94a3b8">add more…</text>

  <!-- ================= SECTION 2 : DESCRIPTION ================= -->
  <text x="460" y="495" font-size="12.5" font-weight="700" fill="#0f172a">Description</text>
  <line x1="460" y1="509" x2="980" y2="509" stroke="#f1f5f9" stroke-width="1"/>

  <rect x="460" y="517" width="520" height="68" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="476" y="540" font-size="12.5" fill="#0f172a">Classic espresso with steamed milk foam, served</text>
  <text x="476" y="560" font-size="12.5" fill="#0f172a">in a small cup. Best enjoyed warm.</text>

  <!-- ================= SECTION 3 : STOCK & AVAILABILITY ================= -->
  <text x="460" y="611" font-size="12.5" font-weight="700" fill="#0f172a">Stock &amp; Availability</text>
  <line x1="460" y1="625" x2="980" y2="625" stroke="#f1f5f9" stroke-width="1"/>

  <rect x="460" y="634" width="250" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="476" y="651" font-size="11.5" font-weight="500" fill="#0f172a">Sync stock usage</text>
  <text x="476" y="665" font-size="9" fill="#64748b">Deduct stock on processing</text>
  <rect x="666" y="642" width="36" height="20" rx="10" fill="#2563eb"/>
  <circle cx="692" cy="652" r="7" fill="#ffffff"/>

  <rect x="730" y="634" width="250" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="746" y="651" font-size="11.5" font-weight="500" fill="#0f172a">Auto out-of-order</text>
  <text x="746" y="665" font-size="9" fill="#64748b">Mark OOO when out of stock</text>
  <rect x="936" y="642" width="36" height="20" rx="10" fill="#2563eb"/>
  <circle cx="962" cy="652" r="7" fill="#ffffff"/>

  <rect x="460" y="682" width="520" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="476" y="699" font-size="11.5" font-weight="500" fill="#0f172a">Out of order</text>
  <text x="476" y="713" font-size="9" fill="#64748b">Temporarily hide this item from the menu and POS</text>
  <rect x="936" y="690" width="36" height="20" rx="10" fill="#e2e8f0"/>
  <circle cx="948" cy="700" r="7" fill="#ffffff"/>

  <!-- ================= FOOTER ================= -->
  <line x1="420" y1="744" x2="1020" y2="744" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Buttons — shifted left so Save Changes ends at x=980 (40px from modal right edge) -->
  <rect x="744" y="762" width="100" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="794" y="786" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

  <rect x="854" y="762" width="126" height="38" rx="10" fill="#2563eb"/>
  <text x="917" y="786" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Save Changes</text>
</svg>
