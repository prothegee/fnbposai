<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Dim backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" opacity="0.7"/>

  <!-- Modal -->
  <rect x="470" y="180" width="500" height="566" rx="16" fill="#111827" filter="url(#modalShadow)"/>

  <!-- Header -->
  <circle cx="514" cy="218" r="16" fill="#172554"/>
  <path d="M514 210 L514 222 M508 216 L520 216" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <text x="546" y="216" font-size="17" font-weight="700" fill="#f1f5f9">Add Tax</text>
  <text x="546" y="236" font-size="11.5" fill="#94a3b8">Create a new tax for the Downtown Branch.</text>
  <circle cx="940" cy="216" r="12" fill="#1e293b" stroke="#334155"/>
  <text x="940" y="220" font-size="11" fill="#94a3b8" text-anchor="middle">✕</text>

  <line x1="470" y1="260" x2="970" y2="260" stroke="#1e293b" stroke-width="1"/>

  <!-- Tax name -->
  <text x="510" y="294" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">TAX NAME <tspan fill="#f87171">*</tspan></text>
  <rect x="510" y="302" width="420" height="46" rx="10" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="331" font-size="13.5" fill="#64748b">e.g. Service Tax, VAT, Local Levy</text>

  <!-- Percentage -->
  <text x="510" y="384" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">PERCENTAGE <tspan fill="#f87171">*</tspan></text>
  <rect x="510" y="392" width="270" height="46" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="530" y="421" font-size="13.5" fill="#64748b">0.00</text>
  <text x="766" y="421" font-size="13.5" font-weight="600" fill="#94a3b8" text-anchor="end">%</text>

  <!-- Hint under percentage -->
  <text x="510" y="454" font-size="10" fill="#64748b">Must be between 0 and 100. Up to 2 decimal places (e.g. 5.00, 11.25).</text>

  <!-- Info banner -->
  <rect x="510" y="478" width="420" height="56" rx="10" fill="#172554" stroke="#1e40af"/>
  <circle cx="532" cy="506" r="9" fill="#3b82f6"/>
  <text x="532" y="510" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">i</text>
  <text x="550" y="502" font-size="11" font-weight="600" fill="#93c5fd">Snapshot on payment</text>
  <text x="550" y="518" font-size="10" fill="#93c5fd" opacity="0.85">Name &amp; percentage are saved into order_tax_line at payment time.</text>

  <!-- Preview -->
  <text x="510" y="562" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">PREVIEW</text>

  <rect x="510" y="572" width="420" height="52" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <circle cx="534" cy="598" r="4" fill="#64748b"/>
  <text x="550" y="602" font-size="12.5" font-weight="500" fill="#cbd5e1">Service Tax</text>
  <text x="912" y="602" font-size="13" font-weight="700" fill="#f1f5f9" text-anchor="end">5.00%</text>

  <line x1="470" y1="656" x2="970" y2="656" stroke="#1e293b" stroke-width="1"/>

  <!-- Buttons -->
  <rect x="690" y="678" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="745" y="704" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <rect x="812" y="678" width="118" height="42" rx="10" fill="#3b82f6"/>
  <text x="871" y="704" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Create Tax</text>
</svg>
