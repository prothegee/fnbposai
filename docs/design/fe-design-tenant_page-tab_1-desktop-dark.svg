<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="1390" cy="40" r="20"/></clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1440" height="900" fill="#0b1220"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="80" fill="#111827"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#1e293b" stroke-width="1"/>

  <!-- Tenant logo -->
  <rect x="20" y="20" width="44" height="44" rx="10" fill="#172554" stroke="#1e40af"/>
  <circle cx="33" cy="32" r="3.2" fill="#60a5fa"/>
  <path d="M28 54 L37 43 L43 50 L47 45 L56 54 Z" fill="#3b82f6"/>

  <!-- split -->
  <line x1="78" y1="22" x2="78" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Tenant name + branch selector -->
  <text x="94" y="38" font-size="15" font-weight="600" fill="#f1f5f9">Sunrise Café</text>
  <rect x="94" y="46" width="168" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="107" y="62" font-size="11.5" fill="#94a3b8">Downtown Branch</text>
  <text x="246" y="63" font-size="10" fill="#64748b">▾</text>

  <!-- Right group : user -->
  <text x="1340" y="36" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="end">jdoe</text>
  <text x="1340" y="53" font-size="10.5" fill="#94a3b8" text-anchor="end">Cashier</text>
  <line x1="1352" y1="22" x2="1352" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="1390" cy="40" r="20" fill="#1e293b" stroke="#334155"/>
  <g clip-path="url(#avatarClip)">
    <circle cx="1390" cy="34" r="7" fill="#64748b"/>
    <circle cx="1390" cy="59" r="14" fill="#64748b"/>
  </g>

  <!-- ============ LEFT SIDEBAR ============ -->
  <rect x="0" y="80" width="210" height="820" fill="#111827"/>
  <line x1="210" y1="80" x2="210" y2="900" stroke="#1e293b" stroke-width="1"/>

  <text x="20" y="104" font-size="9" font-weight="700" fill="#475569" letter-spacing="1.2">MENU</text>
  <circle cx="188" cy="100" r="10" fill="#1e293b" stroke="#334155"/>
  <text x="188" y="104" font-size="10" fill="#94a3b8" text-anchor="middle">«</text>

  <!-- Items -->
  <rect x="20" y="132" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="1.7" fill="#64748b"/>
  <circle cx="32" cy="138" r="1.7" fill="#64748b"/>
  <circle cx="26" cy="144" r="1.7" fill="#64748b"/>
  <circle cx="32" cy="144" r="1.7" fill="#64748b"/>
  <text x="50" y="145" font-size="12.5" fill="#cbd5e1">Items</text>

  <!-- Order -->
  <rect x="20" y="178" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="24" y1="183" x2="34" y2="183" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="187" x2="34" y2="187" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="191" x2="30" y2="191" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="191" font-size="12.5" fill="#cbd5e1">Order</text>

  <!-- Sales -->
  <rect x="20" y="224" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="25" y1="239" x2="25" y2="233" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="239" x2="30" y2="228" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="239" x2="35" y2="231" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="237" font-size="12.5" fill="#cbd5e1">Sales</text>

  <!-- Tenant (Active) -->
  <rect x="12" y="250" width="186" height="32" rx="8" fill="#172554"/>
  <rect x="20" y="257" width="18" height="18" rx="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M23 266 L29 260 L35 266" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="25" y="266" width="8" height="7" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="50" y="270" font-size="12.5" font-weight="600" fill="#60a5fa">Tenant</text>

  <!-- Stocks -->
  <rect x="20" y="300" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="24" y="306" width="10" height="9" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="24" y1="310" x2="34" y2="310" stroke="#64748b" stroke-width="1.4"/>
  <text x="50" y="313" font-size="12.5" fill="#cbd5e1">Stocks</text>

  <!-- Monitor -->
  <rect x="20" y="346" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="24" y="350" width="10" height="8" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="29" y1="358" x2="29" y2="361" stroke="#64748b" stroke-width="1.4"/>
  <line x1="26" y1="362" x2="32" y2="362" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="359" font-size="12.5" fill="#cbd5e1">Monitor</text>
  <text x="188" y="360" font-size="9" fill="#64748b" text-anchor="middle">▾</text>

  <!-- Monitor sub item -->
  <line x1="32" y1="378" x2="32" y2="424" stroke="#1e293b" stroke-width="1"/>
  <circle cx="32" cy="398" r="3" fill="#475569"/>
  <text x="46" y="395" font-size="12" fill="#94a3b8">Orders in &amp; out</text>
  <text x="46" y="411" font-size="9.5" fill="#64748b">Kitchen &amp; Bar</text>

  <!-- Sign out -->
  <line x1="16" y1="820" x2="194" y2="820" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="841" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M30 845 L30 855 M30 845 L36 845 M30 855 L36 855 M33 850 L38 850" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="854" font-size="12.5" fill="#cbd5e1">Sign out</text>

  <!-- ============ MAIN CONTENT AREA ============ -->
  <rect x="210" y="80" width="1230" height="820" fill="#0b1220"/>

  <!-- ============ TAB BAR ============ -->
  <rect x="230" y="100" width="1190" height="40" fill="#111827" rx="8" stroke="#1e293b" stroke-width="1"/>

  <!-- Tab 1: Tenant Info (Active) -->
  <rect x="240" y="108" width="110" height="24" rx="6" fill="#172554"/>
  <text x="295" y="124" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">Tenant Info</text>
  <line x1="240" y1="132" x2="350" y2="132" stroke="#3b82f6" stroke-width="2"/>

  <!-- Tab 2: Branch Info -->
  <rect x="360" y="108" width="110" height="24" rx="6" fill="#1e293b"/>
  <text x="415" y="124" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Branch Info</text>

  <!-- Tab 3: Tax Info -->
  <rect x="480" y="108" width="100" height="24" rx="6" fill="#1e293b"/>
  <text x="530" y="124" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Tax Info</text>

  <!-- Tab 4: Members -->
  <rect x="590" y="108" width="90" height="24" rx="6" fill="#1e293b"/>
  <text x="635" y="124" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Members</text>

  <!-- ============ PAGE HEADER ============ -->
  <text x="230" y="185" font-size="18" font-weight="700" fill="#f1f5f9">Tenant Information</text>
  <text x="230" y="205" font-size="12" fill="#94a3b8">Update your tenant identity, contact details, and address. Changes apply to all branches.</text>

  <!-- Editable badge -->
  <rect x="1280" y="170" width="140" height="26" rx="13" fill="#052e16"/>
  <circle cx="1298" cy="183" r="3.5" fill="#22c55e"/>
  <text x="1310" y="187" font-size="11" font-weight="600" fill="#4ade80">Editable</text>

  <!-- ============ FORM CARD ============ -->
  <rect x="230" y="220" width="1190" height="620" rx="12" fill="#111827" filter="url(#shadow)" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== SECTION 1 : BASIC INFORMATION ===== -->
  <text x="270" y="262" font-size="13" font-weight="700" fill="#f1f5f9">Basic Information</text>
  <line x1="270" y1="278" x2="1380" y2="278" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo preview -->
  <rect x="270" y="300" width="100" height="100" rx="12" fill="#1e293b" stroke="#334155"/>
  <circle cx="304" cy="330" r="6" fill="#64748b"/>
  <path d="M270 388 L310 348 L332 370 L352 350 L370 368 L370 400 L270 400 Z" fill="#64748b"/>

  <!-- Upload button -->
  <rect x="270" y="412" width="100" height="30" rx="7" fill="#1e293b" stroke="#334155"/>
  <text x="320" y="432" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">Upload</text>

  <!-- Helper text -->
  <text x="320" y="462" font-size="10" fill="#64748b" text-anchor="middle">PNG, JPG · max 2MB</text>

  <!-- Right-side fields -->
  <text x="410" y="304" font-size="11" font-weight="600" fill="#94a3b8">TENANT NAME</text>
  <rect x="410" y="312" width="970" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="426" y="336" font-size="12.5" fill="#f1f5f9">Sunrise Café</text>

  <text x="410" y="374" font-size="11" font-weight="600" fill="#94a3b8">BUSINESS CATEGORY</text>
  <rect x="410" y="382" width="970" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="426" y="406" font-size="12.5" fill="#f1f5f9">Café &amp; Bakery</text>
  <text x="1364" y="406" font-size="10" fill="#64748b">▾</text>

  <text x="410" y="444" font-size="11" font-weight="600" fill="#94a3b8">DESCRIPTION</text>
  <rect x="410" y="452" width="970" height="80" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="426" y="476" font-size="12.5" fill="#f1f5f9">A neighborhood café serving specialty coffee,</text>
  <text x="426" y="496" font-size="12.5" fill="#f1f5f9">fresh pastries, and light meals since 2018.</text>

  <!-- ===== SECTION 2 : CONTACT & ADDRESS ===== -->
  <text x="270" y="580" font-size="13" font-weight="700" fill="#f1f5f9">Contact &amp; Address</text>
  <line x1="270" y1="596" x2="1380" y2="596" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 1: Email / Phone -->
  <text x="270" y="624" font-size="11" font-weight="600" fill="#94a3b8">EMAIL</text>
  <rect x="270" y="632" width="540" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="656" font-size="12.5" fill="#f1f5f9">hello@sunrisecafe.id</text>

  <text x="830" y="624" font-size="11" font-weight="600" fill="#94a3b8">PHONE</text>
  <rect x="830" y="632" width="540" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="846" y="656" font-size="12.5" fill="#f1f5f9">+62 812 3456 7890</text>

  <!-- Row 2: Street -->
  <text x="270" y="696" font-size="11" font-weight="600" fill="#94a3b8">STREET ADDRESS</text>
  <rect x="270" y="704" width="1100" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="728" font-size="12.5" fill="#f1f5f9">Jl. Sudirman No. 88, Kel. Karet, Kec. Setiabudi</text>

  <!-- Row 3: City / State / ZIP -->
  <text x="270" y="768" font-size="11" font-weight="600" fill="#94a3b8">CITY</text>
  <rect x="270" y="776" width="350" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="800" font-size="12.5" fill="#f1f5f9">Jakarta Selatan</text>

  <text x="640" y="768" font-size="11" font-weight="600" fill="#94a3b8">STATE / PROVINCE</text>
  <rect x="640" y="776" width="350" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="656" y="800" font-size="12.5" fill="#f1f5f9">DKI Jakarta</text>

  <text x="1010" y="768" font-size="11" font-weight="600" fill="#94a3b8">ZIP / POSTAL</text>
  <rect x="1010" y="776" width="360" height="38" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="1026" y="800" font-size="12.5" fill="#f1f5f9">12950</text>

  <!-- ============ STICKY FOOTER (inside card) ============ -->
  <line x1="230" y1="840" x2="1420" y2="840" stroke="#1e293b" stroke-width="1"/>

  <!-- Cancel -->
  <rect x="1130" y="858" width="110" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1185" y="881" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <!-- Save Changes -->
  <rect x="1250" y="858" width="130" height="36" rx="8" fill="#3b82f6"/>
  <text x="1315" y="881" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save Changes</text>

  <!-- ============ SCROLLBAR ============ -->
  <rect x="1408" y="240" width="6" height="584" rx="3" fill="#1e293b"/>
  <rect x="1408" y="240" width="6" height="300" rx="3" fill="#475569"/>
</svg>
