<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Dim backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" opacity="0.7"/>

  <!-- Modal -->
  <rect x="480" y="220" width="480" height="460" rx="16" fill="#111827" filter="url(#modalShadow)"/>

  <!-- Header -->
  <circle cx="524" cy="258" r="16" fill="#052e16"/>
  <circle cx="524" cy="258" r="6" fill="#22c55e"/>
  <text x="556" y="256" font-size="17" font-weight="700" fill="#f1f5f9">Open Shift</text>
  <text x="556" y="276" font-size="11.5" fill="#94a3b8">Start a new shift to begin accepting orders.</text>
  <circle cx="920" cy="256" r="12" fill="#1e293b" stroke="#334155"/>
  <text x="920" y="260" font-size="11" fill="#94a3b8" text-anchor="middle">✕</text>

  <line x1="480" y1="300" x2="960" y2="300" stroke="#1e293b" stroke-width="1"/>

  <!-- Opening cash -->
  <text x="520" y="334" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">OPENING CASH <tspan fill="#f87171">*</tspan></text>
  <rect x="520" y="342" width="400" height="44" rx="10" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="369" font-size="14" fill="#94a3b8">$</text>
  <text x="558" y="369" font-size="13.5" fill="#64748b">0.00</text>
  <text x="900" y="369" font-size="10" fill="#64748b" text-anchor="end">Count the cash drawer</text>

  <!-- Register -->
  <text x="520" y="418" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">REGISTER</text>
  <rect x="520" y="426" width="400" height="44" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="540" y="453" font-size="13.5" fill="#f1f5f9">Front Counter</text>
  <text x="900" y="453" font-size="11" fill="#64748b">▾</text>

  <!-- Note -->
  <text x="520" y="502" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">NOTE <tspan font-weight="500" fill="#64748b">(optional)</tspan></text>
  <rect x="520" y="510" width="400" height="44" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="540" y="537" font-size="13" fill="#64748b">Add a note for this shift…</text>

  <line x1="480" y1="596" x2="960" y2="596" stroke="#1e293b" stroke-width="1"/>

  <!-- Buttons -->
  <rect x="714" y="618" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="769" y="644" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <rect x="836" y="618" width="100" height="42" rx="10" fill="#3b82f6"/>
  <text x="886" y="644" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Start</text>
</svg>
