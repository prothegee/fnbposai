<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1440" height="900" fill="#0f172a" opacity="0.5"/>

  <rect x="440" y="140" width="560" height="620" rx="16" fill="#ffffff" filter="url(#modalShadow)"/>

  <!-- HEADER -->
  <circle cx="484" cy="178" r="16" fill="#eff6ff"/>
  <path d="M480 172 L477 175 Q474 178 477 181 L480 184 M488 172 L491 175 Q494 178 491 181 L488 184" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <line x1="481" y1="181" x2="487" y2="175" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round"/>

  <text x="516" y="176" font-size="17" font-weight="700" fill="#0f172a">Linked Items</text>
  <text x="516" y="196" font-size="11.5" fill="#64748b">Espresso Beans · used by 3 items</text>

  <circle cx="964" cy="178" r="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="964" y="182" font-size="11" fill="#64748b" text-anchor="middle">✕</text>

  <line x1="440" y1="220" x2="1000" y2="220" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Info banner -->
  <rect x="460" y="238" width="520" height="52" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="482" cy="264" r="9" fill="#2563eb"/>
  <text x="482" y="268" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">i</text>
  <text x="500" y="258" font-size="11" font-weight="600" fill="#1e40af">Recipe links from items_builder</text>
  <text x="500" y="274" font-size="10" fill="#1e40af" opacity="0.85">Weight is deducted from this stock when each item is processed.</text>

  <!-- List header -->
  <text x="460" y="320" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.4">ITEM</text>
  <text x="960" y="320" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="end" letter-spacing="0.4">USES PER ORDER</text>
  <line x1="460" y1="332" x2="980" y2="332" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1 -->
  <rect x="460" y="344" width="520" height="56" rx="10" fill="#ffffff" stroke="#f1f5f9"/>
  <rect x="472" y="356" width="32" height="32" rx="6" fill="#eef2f7" stroke="#e2e8f0"/>
  <circle cx="488" cy="368" r="3.5" fill="#cbd5e1"/>
  <path d="M472 388 L484 376 L490 382 L498 374 L504 380 L504 388 Z" fill="#cbd5e1"/>
  <text x="520" y="368" font-size="12.5" font-weight="500" fill="#0f172a">Cappuccino</text>
  <text x="520" y="384" font-size="10.5" fill="#94a3b8">Coffee</text>
  <text x="960" y="374" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">18.0 g</text>

  <!-- Row 2 -->
  <rect x="460" y="408" width="520" height="56" rx="10" fill="#ffffff" stroke="#f1f5f9"/>
  <rect x="472" y="420" width="32" height="32" rx="6" fill="#eef2f7" stroke="#e2e8f0"/>
  <circle cx="488" cy="432" r="3.5" fill="#cbd5e1"/>
  <path d="M472 452 L484 440 L490 446 L498 438 L504 444 L504 452 Z" fill="#cbd5e1"/>
  <text x="520" y="432" font-size="12.5" font-weight="500" fill="#0f172a">Latte</text>
  <text x="520" y="448" font-size="10.5" fill="#94a3b8">Coffee</text>
  <text x="960" y="438" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">18.0 g</text>

  <!-- Row 3 -->
  <rect x="460" y="472" width="520" height="56" rx="10" fill="#ffffff" stroke="#f1f5f9"/>
  <rect x="472" y="484" width="32" height="32" rx="6" fill="#eef2f7" stroke="#e2e8f0"/>
  <circle cx="488" cy="496" r="3.5" fill="#cbd5e1"/>
  <path d="M472 516 L484 504 L490 510 L498 502 L504 508 L504 516 Z" fill="#cbd5e1"/>
  <text x="520" y="496" font-size="12.5" font-weight="500" fill="#0f172a">Espresso</text>
  <text x="520" y="512" font-size="10.5" fill="#94a3b8">Coffee</text>
  <text x="960" y="502" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">9.0 g</text>

  <!-- Total -->
  <rect x="460" y="546" width="520" height="42" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="476" y="566" font-size="10.5" fill="#64748b">Total deduction across all linked items</text>
  <text x="964" y="572" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">45.0 g</text>

  <!-- Inline CTA — right-aligned -->
  <text x="476" y="614" font-size="10.5" fill="#64748b">Need to add or remove links?</text>
  <text x="964" y="614" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="end">Edit in item recipes →</text>

  <!-- FOOTER -->
  <line x1="440" y1="694" x2="1000" y2="694" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="844" y="712" width="120" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="904" y="736" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Close</text>
</svg>
