<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dim backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#0f172a" opacity="0.5"/>

  <!-- Modal — height extended from 600 to 650 so buttons fit with 22px bottom padding -->
  <rect x="460" y="130" width="520" height="650" rx="16" fill="#ffffff" filter="url(#modalShadow)"/>

  <!-- Header -->
  <circle cx="504" cy="168" r="16" fill="#fef3c7"/>
  <path d="M504 160 L504 168" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <circle cx="504" cy="173" r="1.3" fill="#d97706"/>
  <circle cx="504" cy="176" r="1.3" fill="#d97706"/>
  <text x="536" y="166" font-size="17" font-weight="700" fill="#0f172a">Close Shift</text>
  <text x="536" y="186" font-size="11.5" fill="#64748b">Reconcile cash and end your shift.</text>
  <circle cx="950" cy="166" r="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="950" y="170" font-size="11" fill="#64748b" text-anchor="middle">✕</text>

  <line x1="460" y1="208" x2="980" y2="208" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Shift summary -->
  <text x="500" y="238" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.4">SHIFT SUMMARY</text>

  <rect x="500" y="250" width="440" height="88" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="520" y="274" font-size="11" fill="#64748b">Cashier</text>
  <text x="920" y="274" font-size="12" font-weight="500" fill="#0f172a" text-anchor="end">jdoe</text>

  <text x="520" y="294" font-size="11" fill="#64748b">Duration</text>
  <text x="920" y="294" font-size="12" font-weight="500" fill="#0f172a" text-anchor="end">3h 42m · opened 08:15 AM</text>

  <text x="520" y="314" font-size="11" fill="#64748b">Orders completed</text>
  <text x="920" y="314" font-size="12" font-weight="500" fill="#0f172a" text-anchor="end">42 orders</text>

  <text x="520" y="332" font-size="11" fill="#64748b">Total sales</text>
  <text x="920" y="332" font-size="12" font-weight="500" fill="#0f172a" text-anchor="end">$1,284.50</text>

  <!-- Cash reconciliation -->
  <text x="500" y="368" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.4">CASH RECONCILIATION</text>

  <text x="500" y="392" font-size="11" fill="#64748b">Expected cash</text>
  <text x="940" y="392" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">$642.00</text>
  <text x="940" y="408" font-size="9.5" fill="#94a3b8" text-anchor="end">Opening $200.00 + Cash sales $442.00</text>

  <text x="500" y="436" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.4">ACTUAL CASH COUNTED <tspan fill="#dc2626">*</tspan></text>
  <rect x="500" y="444" width="440" height="46" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="520" y="473" font-size="14" fill="#64748b">$</text>
  <text x="538" y="473" font-size="14" fill="#0f172a">645.00</text>
  <text x="920" y="473" font-size="10" fill="#94a3b8" text-anchor="end">Enter counted amount</text>

  <rect x="500" y="502" width="440" height="42" rx="10" fill="#f0fdf4"/>
  <text x="520" y="528" font-size="12.5" fill="#166534">Difference</text>
  <text x="920" y="528" font-size="14" font-weight="700" fill="#166534" text-anchor="end">+$3.00 over</text>

  <!-- Notes -->
  <text x="500" y="572" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.4">NOTE <tspan font-weight="500" fill="#94a3b8">(optional)</tspan></text>
  <rect x="500" y="580" width="440" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="520" y="608" font-size="13" fill="#94a3b8">Add a note about this shift close…</text>

  <!-- Warning banner -->
  <rect x="500" y="640" width="440" height="42" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <circle cx="524" cy="661" r="9" fill="#f59e0b"/>
  <text x="524" y="665" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="542" y="658" font-size="11.5" font-weight="600" fill="#92400e">2 open bills still active</text>
  <text x="542" y="673" font-size="10.5" fill="#b45309">They will remain open and can be paid on the next shift.</text>

  <line x1="460" y1="700" x2="980" y2="700" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Buttons -->
  <rect x="700" y="718" width="110" height="42" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="755" y="744" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

  <rect x="822" y="718" width="148" height="42" rx="10" fill="#2563eb"/>
  <text x="896" y="744" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Close Shift</text>
</svg>
