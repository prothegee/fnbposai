<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="1390" cy="40" r="20"/></clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1440" height="900" fill="#0b1220"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="80" fill="#111827"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#1e293b" stroke-width="1"/>

  <!-- Tenant logo -->
  <rect x="20" y="20" width="44" height="44" rx="10" fill="#172554" stroke="#1e40af"/>
  <circle cx="33" cy="32" r="3.2" fill="#60a5fa"/>
  <path d="M28 54 L37 43 L43 50 L47 45 L56 54 Z" fill="#3b82f6"/>

  <!-- split -->
  <line x1="78" y1="22" x2="78" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Tenant name + branch selector -->
  <text x="94" y="38" font-size="15" font-weight="600" fill="#f1f5f9">Sunrise Café</text>
  <rect x="94" y="46" width="168" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="107" y="62" font-size="11.5" fill="#94a3b8">Downtown Branch</text>
  <text x="246" y="63" font-size="10" fill="#64748b">▾</text>

  <!-- Right group : user -->
  <text x="1340" y="36" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="end">jdoe</text>
  <text x="1340" y="53" font-size="10.5" fill="#94a3b8" text-anchor="end">Cashier</text>
  <line x1="1352" y1="22" x2="1352" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="1390" cy="40" r="20" fill="#1e293b" stroke="#334155"/>
  <g clip-path="url(#avatarClip)">
    <circle cx="1390" cy="34" r="7" fill="#64748b"/>
    <circle cx="1390" cy="59" r="14" fill="#64748b"/>
  </g>

  <!-- ============ LEFT SIDEBAR ============ -->
  <rect x="0" y="80" width="210" height="820" fill="#111827"/>
  <line x1="210" y1="80" x2="210" y2="900" stroke="#1e293b" stroke-width="1"/>

  <text x="20" y="104" font-size="9" font-weight="700" fill="#475569" letter-spacing="1.2">MENU</text>
  <circle cx="188" cy="100" r="10" fill="#1e293b" stroke="#334155"/>
  <text x="188" y="104" font-size="10" fill="#94a3b8" text-anchor="middle">«</text>

  <!-- Items -->
  <rect x="20" y="132" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="1.7" fill="#64748b"/>
  <circle cx="32" cy="138" r="1.7" fill="#64748b"/>
  <circle cx="26" cy="144" r="1.7" fill="#64748b"/>
  <circle cx="32" cy="144" r="1.7" fill="#64748b"/>
  <text x="50" y="145" font-size="12.5" fill="#cbd5e1">Items</text>

  <!-- Order -->
  <rect x="20" y="178" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="24" y1="183" x2="34" y2="183" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="187" x2="34" y2="187" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="191" x2="30" y2="191" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="191" font-size="12.5" fill="#cbd5e1">Order</text>

  <!-- Sales -->
  <rect x="20" y="224" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="25" y1="239" x2="25" y2="233" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="239" x2="30" y2="228" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="239" x2="35" y2="231" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="237" font-size="12.5" fill="#cbd5e1">Sales</text>

  <!-- Tenant (Active) -->
  <rect x="12" y="250" width="186" height="32" rx="8" fill="#172554"/>
  <rect x="20" y="257" width="18" height="18" rx="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M23 266 L29 260 L35 266" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="25" y="266" width="8" height="7" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="50" y="270" font-size="12.5" font-weight="600" fill="#60a5fa">Tenant</text>

  <!-- Stocks -->
  <rect x="20" y="300" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="24" y="306" width="10" height="9" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="24" y1="310" x2="34" y2="310" stroke="#64748b" stroke-width="1.4"/>
  <text x="50" y="313" font-size="12.5" fill="#cbd5e1">Stocks</text>

  <!-- Monitor -->
  <rect x="20" y="346" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="24" y="350" width="10" height="8" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="29" y1="358" x2="29" y2="361" stroke="#64748b" stroke-width="1.4"/>
  <line x1="26" y1="362" x2="32" y2="362" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="359" font-size="12.5" fill="#cbd5e1">Monitor</text>
  <text x="188" y="360" font-size="9" fill="#64748b" text-anchor="middle">▾</text>

  <!-- Monitor sub item -->
  <line x1="32" y1="378" x2="32" y2="424" stroke="#1e293b" stroke-width="1"/>
  <circle cx="32" cy="398" r="3" fill="#475569"/>
  <text x="46" y="395" font-size="12" fill="#94a3b8">Orders in &amp; out</text>
  <text x="46" y="411" font-size="9.5" fill="#64748b">Kitchen &amp; Bar</text>

  <!-- Sign out -->
  <line x1="16" y1="820" x2="194" y2="820" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="841" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M30 845 L30 855 M30 845 L36 845 M30 855 L36 855 M33 850 L38 850" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="854" font-size="12.5" fill="#cbd5e1">Sign out</text>

  <!-- ============ MAIN CONTENT AREA ============ -->
  <rect x="210" y="80" width="1230" height="820" fill="#0b1220"/>

  <!-- ============ TAB BAR ============ -->
  <rect x="230" y="100" width="1190" height="40" fill="#111827" rx="8" stroke="#1e293b" stroke-width="1"/>

  <!-- Tab 1: Tenant Info -->
  <rect x="240" y="108" width="110" height="24" rx="6" fill="#1e293b"/>
  <text x="295" y="124" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Tenant Info</text>

  <!-- Tab 2: Branch Info -->
  <rect x="360" y="108" width="110" height="24" rx="6" fill="#1e293b"/>
  <text x="415" y="124" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Branch Info</text>

  <!-- Tab 3: Tax Info (Active) -->
  <rect x="480" y="108" width="100" height="24" rx="6" fill="#172554"/>
  <text x="530" y="124" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">Tax Info</text>
  <line x1="480" y1="132" x2="580" y2="132" stroke="#3b82f6" stroke-width="2"/>

  <!-- Tab 4: Members -->
  <rect x="590" y="108" width="90" height="24" rx="6" fill="#1e293b"/>
  <text x="635" y="124" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="middle">Members</text>

  <!-- ============ PAGE HEADER ============ -->
  <text x="230" y="185" font-size="18" font-weight="700" fill="#f1f5f9">Tax Information</text>
  <text x="230" y="205" font-size="12" fill="#94a3b8">Create and manage taxes for the Downtown Branch. Toggle a tax on to include it during customer payment.</text>

  <!-- Add Tax button -->
  <rect x="1300" y="165" width="120" height="36" rx="8" fill="#3b82f6"/>
  <text x="1360" y="187" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">+ Add Tax</text>

  <!-- ============ INFO BANNER ============ -->
  <rect x="230" y="220" width="1190" height="52" rx="10" fill="#172554" stroke="#1e40af" stroke-width="1"/>
  <circle cx="256" cy="246" r="9" fill="#3b82f6"/>
  <text x="256" y="250" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">i</text>
  <text x="278" y="242" font-size="11.5" font-weight="600" fill="#93c5fd">Active taxes apply at payment</text>
  <text x="278" y="260" font-size="10.5" fill="#93c5fd" opacity="0.85">When a customer pays, each enabled tax is snapshotted into <tspan font-family="ui-monospace,Menlo,monospace" font-size="10">order_tax_line</tspan> with its current name and percentage.</text>

  <!-- ============ TABLE CARD ============ -->
  <rect x="230" y="292" width="1190" height="548" rx="12" fill="#111827" filter="url(#shadow)" stroke="#1e293b" stroke-width="1"/>

  <!-- Search bar -->
  <rect x="250" y="312" width="260" height="32" rx="8" fill="#0b1220" stroke="#334155"/>
  <circle cx="270" cy="328" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="275" y1="333" x2="280" y2="338" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="290" y="332" font-size="12" fill="#64748b">Search taxes...</text>

  <!-- Filter: status -->
  <rect x="530" y="312" width="150" height="32" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="545" y="332" font-size="11.5" fill="#cbd5e1">All statuses</text>
  <text x="662" y="333" font-size="9" fill="#64748b">▾</text>

  <!-- Results count -->
  <text x="1400" y="333" font-size="11" fill="#64748b" text-anchor="end">4 taxes configured</text>

  <!-- Table headers -->
  <rect x="230" y="362" width="1190" height="36" fill="#0f172a"/>
  <text x="250" y="384" font-size="11" font-weight="600" fill="#94a3b8">TAX NAME</text>
  <text x="600" y="384" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">PERCENTAGE</text>
  <text x="780" y="384" font-size="11" font-weight="600" fill="#94a3b8">INCLUDE IN PAYMENT</text>
  <text x="1060" y="384" font-size="11" font-weight="600" fill="#94a3b8">LAST UPDATED</text>
  <text x="1360" y="384" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="end">ACTIONS</text>
  <line x1="230" y1="398" x2="1420" y2="398" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== ROW 1: Service Tax ===== -->
  <rect x="230" y="398" width="1190" height="60" fill="#111827"/>
  <text x="250" y="426" font-size="13" font-weight="500" fill="#f1f5f9">Service Tax</text>
  <text x="250" y="444" font-size="10.5" fill="#64748b">Applied to all dine-in orders</text>
  <text x="600" y="432" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="end">5.00%</text>
  <!-- Toggle ON -->
  <rect x="780" y="418" width="44" height="24" rx="12" fill="#3b82f6"/>
  <circle cx="812" cy="430" r="9" fill="#ffffff"/>
  <text x="836" y="434" font-size="11" font-weight="600" fill="#4ade80">On</text>
  <text x="1060" y="432" font-size="11.5" fill="#94a3b8">Feb 20, 2025</text>
  <rect x="1240" y="414" width="56" height="28" rx="7" fill="#1e293b" stroke="#334155"/>
  <text x="1268" y="432" font-size="11" fill="#e2e8f0" text-anchor="middle">Edit</text>
  <rect x="1304" y="414" width="60" height="28" rx="7" fill="#1c0f11" stroke="#7f1d1d"/>
  <text x="1334" y="432" font-size="11" fill="#f87171" text-anchor="middle">Remove</text>
  <line x1="250" y1="458" x2="1400" y2="458" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== ROW 2: VAT ===== -->
  <rect x="230" y="458" width="1190" height="60" fill="#111827"/>
  <text x="250" y="486" font-size="13" font-weight="500" fill="#f1f5f9">VAT</text>
  <text x="250" y="504" font-size="10.5" fill="#64748b">Government value-added tax</text>
  <text x="600" y="492" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="end">11.00%</text>
  <!-- Toggle ON -->
  <rect x="780" y="478" width="44" height="24" rx="12" fill="#3b82f6"/>
  <circle cx="812" cy="490" r="9" fill="#ffffff"/>
  <text x="836" y="494" font-size="11" font-weight="600" fill="#4ade80">On</text>
  <text x="1060" y="492" font-size="11.5" fill="#94a3b8">Feb 20, 2025</text>
  <rect x="1240" y="474" width="56" height="28" rx="7" fill="#1e293b" stroke="#334155"/>
  <text x="1268" y="492" font-size="11" fill="#e2e8f0" text-anchor="middle">Edit</text>
  <rect x="1304" y="474" width="60" height="28" rx="7" fill="#1c0f11" stroke="#7f1d1d"/>
  <text x="1334" y="492" font-size="11" fill="#f87171" text-anchor="middle">Remove</text>
  <line x1="250" y1="518" x2="1400" y2="518" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== ROW 3: Local Levy ===== -->
  <rect x="230" y="518" width="1190" height="60" fill="#111827"/>
  <text x="250" y="546" font-size="13" font-weight="500" fill="#f1f5f9">Local Levy (PB1)</text>
  <text x="250" y="564" font-size="10.5" fill="#64748b">Regional restaurant tax</text>
  <text x="600" y="552" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="end">10.00%</text>
  <!-- Toggle OFF -->
  <rect x="780" y="538" width="44" height="24" rx="12" fill="#334155"/>
  <circle cx="792" cy="550" r="9" fill="#ffffff"/>
  <text x="836" y="554" font-size="11" font-weight="600" fill="#94a3b8">Off</text>
  <text x="1060" y="552" font-size="11.5" fill="#94a3b8">Feb 15, 2025</text>
  <rect x="1240" y="534" width="56" height="28" rx="7" fill="#1e293b" stroke="#334155"/>
  <text x="1268" y="552" font-size="11" fill="#e2e8f0" text-anchor="middle">Edit</text>
  <rect x="1304" y="534" width="60" height="28" rx="7" fill="#1c0f11" stroke="#7f1d1d"/>
  <text x="1334" y="552" font-size="11" fill="#f87171" text-anchor="middle">Remove</text>
  <line x1="250" y1="578" x2="1400" y2="578" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== ROW 4: Packaging Fee ===== -->
  <rect x="230" y="578" width="1190" height="60" fill="#111827"/>
  <text x="250" y="606" font-size="13" font-weight="500" fill="#f1f5f9">Packaging Fee</text>
  <text x="250" y="624" font-size="10.5" fill="#64748b">Applied to takeaway orders</text>
  <text x="600" y="612" font-size="14" font-weight="700" fill="#f1f5f9" text-anchor="end">2.50%</text>
  <!-- Toggle OFF -->
  <rect x="780" y="598" width="44" height="24" rx="12" fill="#334155"/>
  <circle cx="792" cy="610" r="9" fill="#ffffff"/>
  <text x="836" y="614" font-size="11" font-weight="600" fill="#94a3b8">Off</text>
  <text x="1060" y="612" font-size="11.5" fill="#94a3b8">Jan 30, 2025</text>
  <rect x="1240" y="594" width="56" height="28" rx="7" fill="#1e293b" stroke="#334155"/>
  <text x="1268" y="612" font-size="11" fill="#e2e8f0" text-anchor="middle">Edit</text>
  <rect x="1304" y="594" width="60" height="28" rx="7" fill="#1c0f11" stroke="#7f1d1d"/>
  <text x="1334" y="612" font-size="11" fill="#f87171" text-anchor="middle">Remove</text>

  <!-- ============ SCROLLBAR ============ -->
  <rect x="1408" y="398" width="6" height="280" rx="3" fill="#1e293b"/>
  <rect x="1408" y="398" width="6" height="160" rx="3" fill="#475569"/>

  <!-- ============ LAZY LOADING INDICATOR ============ -->
  <circle cx="820" cy="672" r="7" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M820 665 A7 7 0 0 1 827 672" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <text x="835" y="676" font-size="11" fill="#64748b">Loading more taxes…</text>

  <!-- ============ SUMMARY FOOTER ============ -->
  <text x="250" y="820" font-size="11" fill="#94a3b8">Total enabled taxes: <tspan font-weight="600" fill="#f1f5f9">2 taxes applied at payment</tspan></text>
</svg>
