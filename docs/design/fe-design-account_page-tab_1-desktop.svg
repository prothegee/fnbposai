<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.04"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="1390" cy="40" r="20"/></clipPath>
    <clipPath id="profileAvatarClip"><circle cx="320" cy="306" r="44"/></clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8fafc"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="80" fill="#ffffff"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="20" y="20" width="44" height="44" rx="10" fill="#e0edff" stroke="#bfdbfe"/>
  <circle cx="33" cy="32" r="3.2" fill="#93c5fd"/>
  <path d="M28 54 L37 43 L43 50 L47 45 L56 54 Z" fill="#93c5fd"/>

  <line x1="78" y1="22" x2="78" y2="58" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="94" y="38" font-size="15" font-weight="600" fill="#0f172a">Sunrise Café</text>
  <rect x="94" y="46" width="168" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="107" y="62" font-size="11.5" fill="#475569">Downtown Branch</text>
  <text x="246" y="63" font-size="10" fill="#64748b">▾</text>

  <text x="1340" y="36" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">jdoe</text>
  <text x="1340" y="53" font-size="10.5" fill="#64748b" text-anchor="end">Cashier</text>
  <line x1="1352" y1="22" x2="1352" y2="58" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="1390" cy="40" r="21" fill="none" stroke="#2563eb" stroke-width="2"/>
  <circle cx="1390" cy="40" r="20" fill="#e2e8f0"/>
  <g clip-path="url(#avatarClip)">
    <circle cx="1390" cy="34" r="7" fill="#94a3b8"/>
    <circle cx="1390" cy="59" r="14" fill="#94a3b8"/>
  </g>

  <!-- ============ LEFT SIDEBAR ============ -->
  <rect x="0" y="80" width="210" height="820" fill="#ffffff"/>
  <line x1="210" y1="80" x2="210" y2="900" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="104" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.2">MENU</text>
  <circle cx="188" cy="100" r="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="188" y="104" font-size="10" fill="#64748b" text-anchor="middle">«</text>

  <rect x="20" y="132" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="1.7" fill="#94a3b8"/>
  <circle cx="32" cy="138" r="1.7" fill="#94a3b8"/>
  <circle cx="26" cy="144" r="1.7" fill="#94a3b8"/>
  <circle cx="32" cy="144" r="1.7" fill="#94a3b8"/>
  <text x="50" y="145" font-size="12.5" fill="#334155">Items</text>

  <rect x="20" y="178" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="183" x2="34" y2="183" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="187" x2="34" y2="187" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="191" x2="30" y2="191" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="191" font-size="12.5" fill="#334155">Order</text>

  <rect x="20" y="224" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="25" y1="239" x2="25" y2="233" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="239" x2="30" y2="228" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="239" x2="35" y2="231" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="237" font-size="12.5" fill="#334155">Sales</text>

  <rect x="20" y="270" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M23 279 L29 273 L35 279" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="25" y="279" width="8" height="7" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="50" y="283" font-size="12.5" fill="#334155">Tenant</text>

  <rect x="20" y="316" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="322" width="10" height="9" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="24" y1="326" x2="34" y2="326" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="50" y="329" font-size="12.5" fill="#334155">Stocks</text>

  <rect x="20" y="362" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="366" width="10" height="8" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="29" y1="374" x2="29" y2="377" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="26" y1="378" x2="32" y2="378" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="375" font-size="12.5" fill="#334155">Monitor</text>
  <text x="188" y="376" font-size="9" fill="#64748b" text-anchor="middle">▾</text>

  <line x1="32" y1="394" x2="32" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="32" cy="414" r="3" fill="#cbd5e1"/>
  <text x="46" y="411" font-size="12" fill="#475569">Orders in &amp; out</text>
  <text x="46" y="427" font-size="9.5" fill="#94a3b8">Kitchen &amp; Bar</text>

  <line x1="16" y1="820" x2="194" y2="820" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="841" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M30 845 L30 855 M30 845 L36 845 M30 855 L36 855 M33 850 L38 850" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="854" font-size="12.5" fill="#334155">Sign out</text>

  <!-- ============ MAIN CONTENT ============ -->
  <rect x="210" y="80" width="1230" height="820" fill="#f8fafc"/>

  <!-- PAGE HEADER -->
  <text x="230" y="155" font-size="18" font-weight="700" fill="#0f172a">Account</text>
  <text x="230" y="175" font-size="12" fill="#64748b">Manage your personal information. This is separate from your tenant and branch settings.</text>

  <rect x="1260" y="140" width="160" height="26" rx="13" fill="#f0fdf4"/>
  <circle cx="1278" cy="153" r="3.5" fill="#16a34a"/>
  <text x="1290" y="157" font-size="11" font-weight="600" fill="#16a34a">Verified account</text>

  <!-- FORM CARD -->
  <rect x="230" y="190" width="1190" height="650" rx="12" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== SECTION 1 : PROFILE PHOTO & IDENTITY ===== -->
  <text x="270" y="232" font-size="13" font-weight="700" fill="#0f172a">Profile Photo &amp; Identity</text>
  <line x1="270" y1="248" x2="1380" y2="248" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Avatar (head + shoulders properly placed) -->
  <circle cx="320" cy="306" r="44" fill="#e2e8f0"/>
  <g clip-path="url(#profileAvatarClip)">
    <circle cx="320" cy="294" r="13" fill="#94a3b8"/>
    <ellipse cx="320" cy="354" rx="30" ry="24" fill="#94a3b8"/>
  </g>
  <!-- Camera badge -->
  <circle cx="350" cy="336" r="13" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <rect x="344" y="332" width="12" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="350" cy="336.5" r="2.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <rect x="270" y="364" width="100" height="24" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="380" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">Upload Photo</text>

  <rect x="270" y="394" width="100" height="24" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="320" y="410" font-size="10.5" font-weight="600" fill="#94a3b8" text-anchor="middle">Remove</text>

  <text x="320" y="436" font-size="9.5" fill="#94a3b8" text-anchor="middle">PNG, JPG · max 2MB</text>

  <!-- Right-side fields -->
  <text x="440" y="274" font-size="10.5" font-weight="600" fill="#64748b">FULL NAME</text>
  <rect x="440" y="282" width="460" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="456" y="305" font-size="12.5" fill="#0f172a">John Deer</text>

  <text x="920" y="274" font-size="10.5" font-weight="600" fill="#64748b">USERNAME</text>
  <rect x="920" y="282" width="460" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="936" y="305" font-size="12.5" fill="#475569">jdoe</text>
  <text x="1364" y="305" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="end">Locked</text>

  <text x="440" y="344" font-size="10.5" font-weight="600" fill="#64748b">EMAIL ADDRESS</text>
  <rect x="440" y="352" width="460" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="456" y="375" font-size="12.5" fill="#0f172a">jdoe@sunrisecafe.id</text>
  <circle cx="878" cy="370" r="9" fill="#f0fdf4"/>
  <path d="M874 370 L877 373 L882 367" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="920" y="344" font-size="10.5" font-weight="600" fill="#64748b">PHONE NUMBER</text>
  <rect x="920" y="352" width="460" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="936" y="375" font-size="12.5" fill="#0f172a">+62 812 3456 7890</text>

  <text x="440" y="414" font-size="10.5" font-weight="600" fill="#64748b">ROLE &amp; POSITION</text>
  <rect x="440" y="422" width="940" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="460" cy="440" r="4" fill="#64748b"/>
  <text x="474" y="445" font-size="12.5" font-weight="500" fill="#334155">Cashier</text>
  <text x="530" y="445" font-size="12.5" fill="#94a3b8">·</text>
  <text x="544" y="445" font-size="12" fill="#64748b">Staff</text>
  <text x="1364" y="445" font-size="10.5" font-weight="500" fill="#94a3b8" text-anchor="end">Managed by tenant admin</text>

  <!-- ===== SECTION 2 : ABOUT YOU ===== -->
  <text x="270" y="516" font-size="13" font-weight="700" fill="#0f172a">About You</text>
  <line x1="270" y1="532" x2="1380" y2="532" stroke="#f1f5f9" stroke-width="1"/>

  <text x="270" y="556" font-size="10.5" font-weight="600" fill="#64748b">SHORT BIO</text>
  <text x="340" y="556" font-size="9.5" fill="#94a3b8">· optional, visible to teammates</text>
  <rect x="270" y="564" width="1110" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="286" y="584" font-size="12.5" fill="#0f172a">Front-of-house cashier at the Downtown Branch.</text>
  <text x="286" y="606" font-size="12.5" fill="#64748b">Loves coffee, mornings, and clean workflows.</text>

  <!-- ===== SECTION 3 : DANGER ZONE ===== -->
  <text x="270" y="668" font-size="13" font-weight="700" fill="#dc2626">Danger Zone</text>
  <line x1="270" y1="684" x2="1380" y2="684" stroke="#fee2e2" stroke-width="1"/>

  <rect x="270" y="696" width="1110" height="56" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="290" y="720" font-size="12" font-weight="600" fill="#991b1b">Delete account</text>
  <text x="290" y="738" font-size="10.5" fill="#dc2626" opacity="0.9">Permanently remove your account and all associated data. This cannot be undone.</text>
  <rect x="1240" y="708" width="120" height="30" rx="8" fill="#ffffff" stroke="#fecaca"/>
  <text x="1300" y="727" font-size="11.5" font-weight="600" fill="#dc2626" text-anchor="middle">Delete…</text>

  <!-- ============ STICKY FOOTER (with bottom breathing room) ============ -->
  <line x1="230" y1="786" x2="1420" y2="786" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Cancel -->
  <rect x="1130" y="800" width="110" height="30" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1185" y="819" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

  <!-- Save Changes -->
  <rect x="1250" y="800" width="130" height="30" rx="8" fill="#2563eb"/>
  <text x="1315" y="819" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save Changes</text>
</svg>
