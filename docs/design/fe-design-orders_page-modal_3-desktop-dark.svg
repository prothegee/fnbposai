<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Dim backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" opacity="0.7"/>

  <!-- Modal -->
  <rect x="500" y="240" width="440" height="420" rx="16" fill="#111827" filter="url(#modalShadow)"/>

  <!-- Header -->
  <circle cx="544" cy="278" r="16" fill="#172554"/>
  <path d="M536 282 L550 282 M543 275 L543 289" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
  <text x="576" y="276" font-size="17" font-weight="700" fill="#f1f5f9">New Order</text>
  <text x="576" y="296" font-size="11.5" fill="#94a3b8">Create an order to start adding items.</text>
  <circle cx="900" cy="276" r="12" fill="#1e293b" stroke="#334155"/>
  <text x="900" y="280" font-size="11" fill="#94a3b8" text-anchor="middle">✕</text>

  <line x1="500" y1="320" x2="940" y2="320" stroke="#1e293b" stroke-width="1"/>

  <!-- Customer Name -->
  <text x="540" y="354" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">CUSTOMER NAME <tspan fill="#f87171">*</tspan></text>
  <rect x="540" y="362" width="360" height="44" rx="10" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="389" font-size="13.5" fill="#64748b">Enter customer name</text>

  <!-- Table -->
  <text x="540" y="438" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">TABLE <tspan font-weight="500" fill="#64748b">(optional)</tspan></text>
  <rect x="540" y="446" width="360" height="44" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="560" y="473" font-size="13" fill="#64748b">e.g. Table 5</text>

  <!-- Open Bill -->
  <rect x="540" y="510" width="18" height="18" rx="4" fill="#0f172a" stroke="#334155"/>
  <text x="570" y="524" font-size="13" font-weight="500" fill="#e2e8f0">Open Bill</text>
  <text x="570" y="542" font-size="10.5" fill="#64748b">Keep this order open for later payment</text>

  <line x1="500" y1="580" x2="940" y2="580" stroke="#1e293b" stroke-width="1"/>

  <!-- Buttons -->
  <rect x="680" y="602" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="735" y="628" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <rect x="802" y="602" width="118" height="42" rx="10" fill="#3b82f6"/>
  <text x="861" y="628" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Create Order</text>
</svg>
