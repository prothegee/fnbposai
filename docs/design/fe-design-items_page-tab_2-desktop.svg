<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.04"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="1390" cy="40" r="20"/></clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1440" height="900" fill="#f8fafc"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="80" fill="#ffffff"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tenant logo -->
  <rect x="20" y="20" width="44" height="44" rx="10" fill="#e0edff" stroke="#bfdbfe"/>
  <circle cx="33" cy="32" r="3.2" fill="#93c5fd"/>
  <path d="M28 54 L37 43 L43 50 L47 45 L56 54 Z" fill="#93c5fd"/>

  <!-- split -->
  <line x1="78" y1="22" x2="78" y2="58" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Tenant name + branch selector -->
  <text x="94" y="38" font-size="15" font-weight="600" fill="#0f172a">Sunrise Café</text>
  <rect x="94" y="46" width="168" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="107" y="62" font-size="11.5" fill="#475569">Downtown Branch</text>
  <text x="246" y="63" font-size="10" fill="#64748b">▾</text>

  <!-- Right group : user -->
  <text x="1340" y="36" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">jdoe</text>
  <text x="1340" y="53" font-size="10.5" fill="#64748b" text-anchor="end">Cashier</text>
  <line x1="1352" y1="22" x2="1352" y2="58" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="1390" cy="40" r="20" fill="#e2e8f0" stroke="#cbd5e1"/>
  <g clip-path="url(#avatarClip)">
    <circle cx="1390" cy="34" r="7" fill="#94a3b8"/>
    <circle cx="1390" cy="59" r="14" fill="#94a3b8"/>
  </g>

  <!-- ============ LEFT SIDEBAR ============ -->
  <rect x="0" y="80" width="210" height="820" fill="#ffffff"/>
  <line x1="210" y1="80" x2="210" y2="900" stroke="#e2e8f0" stroke-width="1"/>

  <text x="20" y="104" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="1.2">MENU</text>
  <circle cx="188" cy="100" r="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="188" y="104" font-size="10" fill="#64748b" text-anchor="middle">«</text>

  <!-- Items (Active) -->
  <rect x="12" y="125" width="186" height="32" rx="8" fill="#eff6ff"/>
  <rect x="20" y="132" width="18" height="18" rx="5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="1.7" fill="#2563eb"/>
  <circle cx="32" cy="138" r="1.7" fill="#2563eb"/>
  <circle cx="26" cy="144" r="1.7" fill="#2563eb"/>
  <circle cx="32" cy="144" r="1.7" fill="#2563eb"/>
  <text x="50" y="145" font-size="12.5" font-weight="600" fill="#2563eb">Items</text>

  <!-- Order -->
  <rect x="20" y="178" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="24" y1="183" x2="34" y2="183" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="187" x2="34" y2="187" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="191" x2="30" y2="191" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="191" font-size="12.5" fill="#334155">Order</text>

  <!-- Sales -->
  <rect x="20" y="224" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="25" y1="239" x2="25" y2="233" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="239" x2="30" y2="228" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="239" x2="35" y2="231" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="237" font-size="12.5" fill="#334155">Sales</text>

  <!-- Tenant -->
  <rect x="20" y="270" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M23 279 L29 273 L35 279" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="25" y="279" width="8" height="7" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="50" y="283" font-size="12.5" fill="#334155">Tenant</text>

  <!-- Stocks -->
  <rect x="20" y="316" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="322" width="10" height="9" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="24" y1="326" x2="34" y2="326" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="50" y="329" font-size="12.5" fill="#334155">Stocks</text>

  <!-- Monitor -->
  <rect x="20" y="362" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="24" y="366" width="10" height="8" rx="1.5" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="29" y1="374" x2="29" y2="377" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="26" y1="378" x2="32" y2="378" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="375" font-size="12.5" fill="#334155">Monitor</text>
  <text x="188" y="376" font-size="9" fill="#64748b" text-anchor="middle">▾</text>

  <!-- Monitor sub item -->
  <line x1="32" y1="394" x2="32" y2="440" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="32" cy="414" r="3" fill="#cbd5e1"/>
  <text x="46" y="411" font-size="12" fill="#475569">Orders in &amp; out</text>
  <text x="46" y="427" font-size="9.5" fill="#94a3b8">Kitchen &amp; Bar</text>

  <!-- Sign out -->
  <line x1="16" y1="820" x2="194" y2="820" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="841" width="18" height="18" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M30 845 L30 855 M30 845 L36 845 M30 855 L36 855 M33 850 L38 850" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="854" font-size="12.5" fill="#334155">Sign out</text>

  <!-- ============ MAIN CONTENT ============ -->
  <rect x="210" y="80" width="1230" height="820" fill="#f8fafc"/>

  <!-- ============ TAB BAR ============ -->
  <rect x="230" y="96" width="1190" height="44" rx="10" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Tab 1: Items Data -->
  <rect x="240" y="104" width="110" height="28" rx="6" fill="transparent"/>
  <text x="295" y="123" font-size="12.5" font-weight="500" fill="#64748b" text-anchor="middle">Items Data</text>

  <!-- Tab 2: Add Item (Active) -->
  <rect x="360" y="104" width="110" height="28" rx="6" fill="#eff6ff"/>
  <text x="415" y="123" font-size="12.5" font-weight="600" fill="#2563eb" text-anchor="middle">Add Item</text>

  <!-- ============ PAGE HEADER ============ -->
  <text x="230" y="185" font-size="18" font-weight="700" fill="#0f172a">Add New Item</text>
  <text x="230" y="205" font-size="12" fill="#64748b">Create a new menu item. Fields marked with * are required. Use the recipe section to auto-deduct stocks on order.</text>

  <!-- Draft badge -->
  <rect x="1280" y="170" width="140" height="26" rx="13" fill="#fef3c7"/>
  <circle cx="1298" cy="183" r="3.5" fill="#d97706"/>
  <text x="1310" y="187" font-size="11" font-weight="600" fill="#b45309">Draft</text>

  <!-- ============ FORM CARD (footer inside) ============ -->
  <rect x="230" y="220" width="1190" height="680" rx="12" fill="#ffffff" filter="url(#cardShadow)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== SECTION 1 : BASIC INFORMATION ===== -->
  <text x="270" y="248" font-size="13" font-weight="700" fill="#0f172a">Basic Information</text>
  <line x1="270" y1="260" x2="1380" y2="260" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Thumbnail -->
  <rect x="270" y="274" width="100" height="100" rx="12" fill="#eef2f7" stroke="#e2e8f0"/>
  <circle cx="304" cy="304" r="6" fill="#cbd5e1"/>
  <path d="M270 362 L310 322 L332 344 L352 324 L370 342 L370 374 L270 374 Z" fill="#cbd5e1"/>

  <!-- Browse -->
  <rect x="270" y="382" width="100" height="24" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="398" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Browse…</text>

  <!-- AI Generate -->
  <rect x="270" y="410" width="100" height="24" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="320" y="426" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">✦ AI Generate</text>

  <!-- Helper -->
  <text x="320" y="450" font-size="10" fill="#94a3b8" text-anchor="middle">PNG, JPG · max 2MB</text>

  <!-- Item Name -->
  <text x="400" y="284" font-size="10.5" font-weight="600" fill="#64748b">ITEM NAME <tspan fill="#dc2626">*</tspan></text>
  <rect x="400" y="290" width="470" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="416" y="311" font-size="12.5" fill="#94a3b8">Enter item name</text>

  <!-- Category -->
  <text x="900" y="284" font-size="10.5" font-weight="600" fill="#64748b">CATEGORY</text>
  <rect x="900" y="290" width="480" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="916" y="311" font-size="12.5" fill="#94a3b8">Select category</text>
  <text x="1364" y="306" font-size="10" fill="#64748b">▾</text>

  <!-- Price -->
  <text x="400" y="344" font-size="10.5" font-weight="600" fill="#64748b">PRICE <tspan fill="#dc2626">*</tspan></text>
  <rect x="400" y="350" width="225" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="416" y="371" font-size="13" fill="#64748b">$</text>
  <text x="434" y="371" font-size="12.5" fill="#94a3b8">0.00</text>

  <!-- Currency -->
  <text x="645" y="344" font-size="10.5" font-weight="600" fill="#64748b">CURRENCY</text>
  <rect x="645" y="350" width="225" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="661" y="371" font-size="12.5" fill="#0f172a">USD</text>
  <text x="860" y="366" font-size="10" fill="#64748b">▾</text>

  <!-- Weight -->
  <text x="900" y="344" font-size="10.5" font-weight="600" fill="#64748b">WEIGHT</text>
  <rect x="900" y="350" width="225" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="916" y="371" font-size="12.5" fill="#94a3b8">e.g. 350</text>

  <!-- Weight Unit -->
  <text x="1145" y="344" font-size="10.5" font-weight="600" fill="#64748b">WEIGHT UNIT</text>
  <rect x="1145" y="350" width="235" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1161" y="371" font-size="12.5" fill="#0f172a">g</text>
  <text x="1370" y="366" font-size="10" fill="#64748b">▾</text>

  <!-- Tags -->
  <text x="400" y="404" font-size="10.5" font-weight="600" fill="#64748b">TAGS</text>
  <text x="440" y="404" font-size="9.5" fill="#94a3b8">· up to 6</text>
  <rect x="400" y="410" width="980" height="32" rx="8" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="412" y="414" width="58" height="24" rx="12" fill="#eff6ff"/>
  <text x="441" y="430" font-size="11" fill="#2563eb" text-anchor="middle">coffee</text>

  <rect x="478" y="414" width="42" height="24" rx="12" fill="#eff6ff"/>
  <text x="499" y="430" font-size="11" fill="#2563eb" text-anchor="middle">hot</text>

  <rect x="528" y="414" width="76" height="24" rx="12" fill="#eff6ff"/>
  <text x="566" y="430" font-size="11" fill="#2563eb" text-anchor="middle">signature</text>

  <text x="618" y="430" font-size="11" fill="#94a3b8">add more…</text>

  <!-- ===== SECTION 2 : DESCRIPTION ===== -->
  <text x="270" y="478" font-size="13" font-weight="700" fill="#0f172a">Description</text>
  <line x1="270" y1="490" x2="1380" y2="490" stroke="#f1f5f9" stroke-width="1"/>

  <!-- AI Suggestion button -->
  <rect x="1250" y="470" width="130" height="26" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1315" y="487" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">✦ AI Suggestion</text>

  <!-- Textarea -->
  <rect x="270" y="500" width="1110" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="286" y="520" font-size="12.5" fill="#94a3b8">Describe your item…</text>
  <text x="286" y="546" font-size="10.5" fill="#94a3b8">Tip: Fill in the item name above, then click ✦ AI Suggestion to draft a description.</text>

  <!-- ===== SECTION 3 : STOCK & AVAILABILITY ===== -->
  <text x="270" y="596" font-size="13" font-weight="700" fill="#0f172a">Stock &amp; Availability</text>
  <line x1="270" y1="608" x2="1380" y2="608" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Toggle 1 : Sync stock -->
  <rect x="270" y="616" width="540" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="286" y="632" font-size="12" font-weight="500" fill="#0f172a">Sync stock usage</text>
  <text x="286" y="645" font-size="9.5" fill="#64748b">Deduct stock when order status becomes processing</text>
  <rect x="746" y="621" width="44" height="24" rx="12" fill="#2563eb"/>
  <circle cx="778" cy="633" r="9" fill="#ffffff"/>

  <!-- Toggle 2 : Auto out-of-order -->
  <rect x="830" y="616" width="550" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="846" y="632" font-size="12" font-weight="500" fill="#0f172a">Auto out-of-order</text>
  <text x="846" y="645" font-size="9.5" fill="#64748b">Mark out-of-order when stock runs out after completion</text>
  <rect x="1316" y="621" width="44" height="24" rx="12" fill="#2563eb"/>
  <circle cx="1348" cy="633" r="9" fill="#ffffff"/>

  <!-- Toggle 3 : Out of order -->
  <rect x="270" y="656" width="540" height="34" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="286" y="672" font-size="12" font-weight="500" fill="#0f172a">Out of order</text>
  <text x="286" y="685" font-size="9.5" fill="#64748b">Temporarily hide this item from the menu</text>
  <rect x="746" y="661" width="44" height="24" rx="12" fill="#e2e8f0"/>
  <circle cx="758" cy="673" r="9" fill="#ffffff"/>

  <!-- ===== SECTION 4 : RECIPE ===== -->
  <text x="270" y="724" font-size="13" font-weight="700" fill="#0f172a">Recipe (Stock Deduction)</text>
  <line x1="270" y1="736" x2="1380" y2="736" stroke="#f1f5f9" stroke-width="1"/>

  <!-- + Add Stock button (aligned with section header) -->
  <rect x="1250" y="712" width="130" height="26" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1315" y="729" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">+ Add Stock</text>

  <!-- Recipe row 1 -->
  <rect x="270" y="746" width="1110" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="290" y="766" font-size="12" font-weight="500" fill="#0f172a">Espresso Beans</text>
  <text x="290" y="780" font-size="9.5" fill="#94a3b8">Dark roast · 1kg bag</text>
  <rect x="700" y="754" width="140" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="716" y="771" font-size="11.5" fill="#0f172a">18.0</text>
  <rect x="856" y="754" width="140" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="872" y="771" font-size="11.5" fill="#0f172a">g</text>
  <text x="1360" y="771" font-size="11" fill="#dc2626" text-anchor="end">Remove</text>

  <!-- ============ SCROLLBAR (content area only, above footer) ============ -->
  <rect x="1408" y="240" width="6" height="570" rx="3" fill="#f1f5f9"/>
  <rect x="1408" y="240" width="6" height="340" rx="3" fill="#cbd5e1"/>

  <!-- ============ STICKY FOOTER (inside card) ============ -->
  <line x1="230" y1="820" x2="1420" y2="820" stroke="#e2e8f0" stroke-width="1"/>

  <!-- + Add More Item (moved further left) -->
  <rect x="250" y="842" width="160" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="330" y="865" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">+ Add More Item</text>

  <!-- Cancel (moved further right) -->
  <rect x="1160" y="842" width="110" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1215" y="865" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Cancel</text>

  <!-- Save Item (moved further right) -->
  <rect x="1280" y="842" width="130" height="36" rx="8" fill="#2563eb"/>
  <text x="1345" y="865" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save Item</text>
</svg>
