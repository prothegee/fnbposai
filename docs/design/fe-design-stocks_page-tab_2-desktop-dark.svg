<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="avatarClip"><circle cx="1390" cy="40" r="20"/></clipPath>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1440" height="900" fill="#0b1220"/>

  <!-- ============ TOP BAR ============ -->
  <rect x="0" y="0" width="1440" height="80" fill="#111827"/>
  <line x1="0" y1="80" x2="1440" y2="80" stroke="#1e293b" stroke-width="1"/>

  <rect x="20" y="20" width="44" height="44" rx="10" fill="#172554" stroke="#1e40af"/>
  <circle cx="33" cy="32" r="3.2" fill="#60a5fa"/>
  <path d="M28 54 L37 43 L43 50 L47 45 L56 54 Z" fill="#3b82f6"/>

  <line x1="78" y1="22" x2="78" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="94" y="38" font-size="15" font-weight="600" fill="#f1f5f9">Sunrise Café</text>
  <rect x="94" y="46" width="168" height="24" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="107" y="62" font-size="11.5" fill="#94a3b8">Downtown Branch</text>
  <text x="246" y="63" font-size="10" fill="#64748b">▾</text>

  <text x="1340" y="36" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="end">jdoe</text>
  <text x="1340" y="53" font-size="10.5" fill="#94a3b8" text-anchor="end">Cashier</text>
  <line x1="1352" y1="22" x2="1352" y2="58" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="1390" cy="40" r="20" fill="#1e293b" stroke="#334155"/>
  <g clip-path="url(#avatarClip)">
    <circle cx="1390" cy="34" r="7" fill="#64748b"/>
    <circle cx="1390" cy="59" r="14" fill="#64748b"/>
  </g>

  <!-- ============ LEFT SIDEBAR ============ -->
  <rect x="0" y="80" width="210" height="820" fill="#111827"/>
  <line x1="210" y1="80" x2="210" y2="900" stroke="#1e293b" stroke-width="1"/>

  <text x="20" y="104" font-size="9" font-weight="700" fill="#475569" letter-spacing="1.2">MENU</text>
  <circle cx="188" cy="100" r="10" fill="#1e293b" stroke="#334155"/>
  <text x="188" y="104" font-size="10" fill="#94a3b8" text-anchor="middle">«</text>

  <rect x="20" y="132" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="26" cy="138" r="1.7" fill="#64748b"/>
  <circle cx="32" cy="138" r="1.7" fill="#64748b"/>
  <circle cx="26" cy="144" r="1.7" fill="#64748b"/>
  <circle cx="32" cy="144" r="1.7" fill="#64748b"/>
  <text x="50" y="145" font-size="12.5" fill="#cbd5e1">Items</text>

  <rect x="20" y="178" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="24" y1="183" x2="34" y2="183" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="187" x2="34" y2="187" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="24" y1="191" x2="30" y2="191" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="191" font-size="12.5" fill="#cbd5e1">Order</text>

  <rect x="20" y="224" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="25" y1="239" x2="25" y2="233" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="239" x2="30" y2="228" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="239" x2="35" y2="231" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="50" y="237" font-size="12.5" fill="#cbd5e1">Sales</text>

  <rect x="20" y="270" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M23 279 L29 273 L35 279" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="25" y="279" width="8" height="7" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <text x="50" y="283" font-size="12.5" fill="#cbd5e1">Tenant</text>

  <rect x="12" y="296" width="186" height="32" rx="8" fill="#172554"/>
  <rect x="20" y="303" width="18" height="18" rx="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="24" y="308" width="10" height="9" rx="1.5" fill="none" stroke="#3b82f6" stroke-width="1.4"/>
  <line x1="24" y1="312" x2="34" y2="312" stroke="#3b82f6" stroke-width="1.4"/>
  <text x="50" y="315" font-size="12.5" font-weight="600" fill="#60a5fa">Stocks</text>

  <rect x="20" y="346" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="24" y="350" width="10" height="8" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.4"/>
  <line x1="29" y1="358" x2="29" y2="361" stroke="#64748b" stroke-width="1.4"/>
  <line x1="26" y1="362" x2="32" y2="362" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="359" font-size="12.5" fill="#cbd5e1">Monitor</text>
  <text x="188" y="360" font-size="9" fill="#64748b" text-anchor="middle">▾</text>

  <line x1="32" y1="378" x2="32" y2="424" stroke="#1e293b" stroke-width="1"/>
  <circle cx="32" cy="398" r="3" fill="#475569"/>
  <text x="46" y="395" font-size="12" fill="#94a3b8">Orders in &amp; out</text>
  <text x="46" y="411" font-size="9.5" fill="#64748b">Kitchen &amp; Bar</text>

  <line x1="16" y1="820" x2="194" y2="820" stroke="#1e293b" stroke-width="1"/>
  <rect x="20" y="841" width="18" height="18" rx="5" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M30 845 L30 855 M30 845 L36 845 M30 855 L36 855 M33 850 L38 850" fill="none" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
  <text x="50" y="854" font-size="12.5" fill="#cbd5e1">Sign out</text>

  <!-- ============ MAIN CONTENT ============ -->
  <rect x="210" y="80" width="1230" height="820" fill="#0b1220"/>

  <!-- ============ TAB BAR ============ -->
  <rect x="230" y="96" width="1190" height="44" rx="10" fill="#111827" filter="url(#cardShadow)" stroke="#1e293b" stroke-width="1"/>

  <rect x="240" y="104" width="120" height="28" rx="6" fill="transparent"/>
  <text x="300" y="123" font-size="12.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Stock Status</text>

  <rect x="370" y="104" width="110" height="28" rx="6" fill="#172554"/>
  <text x="425" y="123" font-size="12.5" font-weight="600" fill="#60a5fa" text-anchor="middle">Add Stock</text>

  <!-- ============ PAGE HEADER ============ -->
  <text x="230" y="185" font-size="18" font-weight="700" fill="#f1f5f9">Add New Stock</text>
  <text x="230" y="205" font-size="12" fill="#94a3b8">Create a stock entry. It will be available for item recipes (<tspan font-family="ui-monospace,Menlo,monospace" font-size="11">items_builder</tspan>) and auto-deducted on order processing.</text>

  <rect x="1280" y="170" width="140" height="26" rx="13" fill="#422006"/>
  <circle cx="1298" cy="183" r="3.5" fill="#f59e0b"/>
  <text x="1310" y="187" font-size="11" font-weight="600" fill="#fbbf24">Draft</text>

  <!-- ============ FORM CARD ============ -->
  <rect x="230" y="220" width="1190" height="680" rx="12" fill="#111827" filter="url(#cardShadow)" stroke="#1e293b" stroke-width="1"/>

  <!-- ===== SECTION 1 : BASIC INFORMATION ===== -->
  <text x="270" y="248" font-size="13" font-weight="700" fill="#f1f5f9">Basic Information</text>
  <line x1="270" y1="260" x2="1380" y2="260" stroke="#1e293b" stroke-width="1"/>

  <!-- Thumbnail -->
  <rect x="270" y="274" width="80" height="80" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="290" y="302" width="40" height="34" rx="4" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="290" y1="314" x2="330" y2="314" stroke="#64748b" stroke-width="2"/>

  <rect x="270" y="362" width="80" height="22" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="310" y="377" font-size="10.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">Browse…</text>

  <rect x="270" y="390" width="80" height="22" rx="6" fill="#172554" stroke="#1e40af"/>
  <text x="310" y="405" font-size="9.5" font-weight="600" fill="#60a5fa" text-anchor="middle">✦ AI Generate</text>

  <text x="310" y="428" font-size="9.5" fill="#64748b" text-anchor="middle">PNG, JPG · max 2MB</text>

  <!-- Stock Name -->
  <text x="380" y="282" font-size="10.5" font-weight="600" fill="#94a3b8">STOCK NAME <tspan fill="#f87171">*</tspan></text>
  <rect x="380" y="288" width="490" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="396" y="308" font-size="12.5" fill="#64748b">e.g. Espresso Beans</text>

  <!-- Category -->
  <text x="900" y="282" font-size="10.5" font-weight="600" fill="#94a3b8">CATEGORY</text>
  <rect x="900" y="288" width="480" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="916" y="308" font-size="12.5" fill="#64748b">Select category</text>
  <text x="1364" y="303" font-size="10" fill="#64748b">▾</text>

  <!-- Tags -->
  <text x="380" y="340" font-size="10.5" font-weight="600" fill="#94a3b8">TAGS</text>
  <text x="420" y="340" font-size="9.5" fill="#64748b">· up to 6</text>
  <rect x="380" y="346" width="1000" height="30" rx="8" fill="#0b1220" stroke="#334155"/>

  <rect x="392" y="350" width="58" height="22" rx="11" fill="#1e3a8a"/>
  <text x="421" y="365" font-size="10.5" fill="#93c5fd" text-anchor="middle">coffee</text>

  <rect x="458" y="350" width="42" height="22" rx="11" fill="#1e3a8a"/>
  <text x="479" y="365" font-size="10.5" fill="#93c5fd" text-anchor="middle">raw</text>

  <rect x="508" y="350" width="80" height="22" rx="11" fill="#1e3a8a"/>
  <text x="548" y="365" font-size="10.5" fill="#93c5fd" text-anchor="middle">essentials</text>

  <text x="600" y="365" font-size="10.5" fill="#64748b">add more…</text>

  <!-- ===== SECTION 2 : QUANTITY & WARNING ===== -->
  <text x="270" y="456" font-size="13" font-weight="700" fill="#f1f5f9">Quantity &amp; Warning</text>
  <line x1="270" y1="468" x2="1380" y2="468" stroke="#1e293b" stroke-width="1"/>

  <text x="270" y="490" font-size="10.5" font-weight="600" fill="#94a3b8">QUANTITY</text>
  <rect x="270" y="496" width="390" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="516" font-size="12.5" fill="#64748b">0</text>

  <text x="680" y="490" font-size="10.5" font-weight="600" fill="#94a3b8">WARNING QTY</text>
  <rect x="680" y="496" width="390" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="696" y="516" font-size="12.5" fill="#64748b">0</text>

  <rect x="270" y="538" width="1110" height="40" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="290" y="556" font-size="12" font-weight="500" fill="#f1f5f9">Out of stock</text>
  <text x="290" y="570" font-size="9.5" fill="#94a3b8">Mark this stock as unavailable (hides linked items if auto-out-of-order is on)</text>
  <rect x="1316" y="546" width="44" height="24" rx="12" fill="#334155"/>
  <circle cx="1328" cy="558" r="9" fill="#ffffff"/>

  <!-- ===== SECTION 3 : WEIGHT & DEDUCT ===== -->
  <text x="270" y="602" font-size="13" font-weight="700" fill="#f1f5f9">Weight &amp; Deduct</text>
  <line x1="270" y1="614" x2="1380" y2="614" stroke="#1e293b" stroke-width="1"/>

  <text x="270" y="636" font-size="10.5" font-weight="600" fill="#94a3b8">WEIGHT PER UNIT</text>
  <rect x="270" y="642" width="350" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="662" font-size="12.5" fill="#64748b">e.g. 1.00</text>

  <text x="640" y="636" font-size="10.5" font-weight="600" fill="#94a3b8">WEIGHT UNIT</text>
  <rect x="640" y="642" width="350" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="656" y="662" font-size="12.5" fill="#f1f5f9">kg</text>
  <text x="970" y="657" font-size="10" fill="#64748b">▾</text>

  <text x="1010" y="636" font-size="10.5" font-weight="600" fill="#94a3b8">DEDUCT <tspan fill="#64748b" font-weight="500">(auto)</tspan></text>
  <rect x="1010" y="642" width="370" height="30" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="1026" y="662" font-size="12.5" font-weight="600" fill="#94a3b8">0.00</text>
  <text x="1364" y="662" font-size="11" fill="#64748b" text-anchor="end">kg</text>

  <text x="1010" y="686" font-size="9.5" fill="#64748b" font-style="italic">auto = quantity × weight per unit</text>

  <!-- ===== SECTION 4 : DESCRIPTION & EXTRA INFO ===== -->
  <text x="270" y="714" font-size="13" font-weight="700" fill="#f1f5f9">Description &amp; Extra Info</text>
  <line x1="270" y1="726" x2="1380" y2="726" stroke="#1e293b" stroke-width="1"/>

  <rect x="1250" y="702" width="130" height="24" rx="8" fill="#172554" stroke="#1e40af"/>
  <text x="1315" y="718" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">✦ AI Suggestion</text>

  <rect x="270" y="736" width="1110" height="52" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="756" font-size="12.5" fill="#64748b">Describe this stock item…</text>
  <text x="286" y="778" font-size="10" fill="#64748b">Tip: fill in the stock name first, then click ✦ AI Suggestion to draft a description.</text>

  <text x="270" y="812" font-size="10.5" font-weight="600" fill="#94a3b8">EXTRA INFO</text>
  <rect x="270" y="818" width="1110" height="30" rx="8" fill="#0b1220" stroke="#334155"/>
  <text x="286" y="838" font-size="12.5" fill="#64748b">Supplier notes, storage instructions, etc.</text>

  <!-- ============ SCROLLBAR ============ -->
  <rect x="1408" y="240" width="6" height="576" rx="3" fill="#1e293b"/>
  <rect x="1408" y="240" width="6" height="300" rx="3" fill="#475569"/>

  <!-- ============ STICKY FOOTER (inside card) ============ -->
  <line x1="230" y1="858" x2="1420" y2="858" stroke="#1e293b" stroke-width="1"/>

  <!-- + Add More Stock -->
  <rect x="270" y="868" width="170" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="355" y="886" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">+ Add More Stock</text>

  <!-- Cancel -->
  <rect x="1130" y="868" width="110" height="28" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="1185" y="886" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <!-- Save Stock -->
  <rect x="1250" y="868" width="130" height="28" rx="8" fill="#3b82f6"/>
  <text x="1315" y="886" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Save Stock</text>
</svg>
