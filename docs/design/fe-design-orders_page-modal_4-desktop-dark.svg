<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>text { font-family: 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; }</style>
    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="40" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Dim backdrop -->
  <rect x="0" y="0" width="1440" height="900" fill="#020617" opacity="0.7"/>

  <!-- Modal -->
  <rect x="470" y="140" width="500" height="620" rx="16" fill="#111827" filter="url(#modalShadow)"/>

  <!-- Header -->
  <circle cx="514" cy="178" r="16" fill="#052e16"/>
  <path d="M506 178 L512 184 L522 172" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="546" y="176" font-size="17" font-weight="700" fill="#f1f5f9">Pay Order #1042</text>
  <text x="546" y="196" font-size="11.5" fill="#94a3b8">Table 5 · John Deer</text>
  <circle cx="940" cy="176" r="12" fill="#1e293b" stroke="#334155"/>
  <text x="940" y="180" font-size="11" fill="#94a3b8" text-anchor="middle">✕</text>

  <line x1="470" y1="220" x2="970" y2="220" stroke="#1e293b" stroke-width="1"/>

  <!-- Order summary -->
  <text x="510" y="254" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">ORDER SUMMARY</text>

  <text x="510" y="280" font-size="12.5" fill="#cbd5e1">Subtotal</text>
  <text x="930" y="280" font-size="12.5" fill="#cbd5e1" text-anchor="end">60.00</text>

  <text x="510" y="302" font-size="12.5" fill="#cbd5e1">Tax (10%)</text>
  <text x="930" y="302" font-size="12.5" fill="#cbd5e1" text-anchor="end">6.00</text>

  <line x1="510" y1="320" x2="930" y2="320" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="510" y="346" font-size="15" font-weight="700" fill="#f1f5f9">Total</text>
  <text x="930" y="346" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="end">66.00</text>

  <line x1="470" y1="366" x2="970" y2="366" stroke="#1e293b" stroke-width="1"/>

  <!-- Payment method -->
  <text x="510" y="398" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">PAYMENT METHOD</text>

  <rect x="510" y="410" width="130" height="42" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="575" y="437" font-size="13" font-weight="600" fill="#60a5fa" text-anchor="middle">Cash</text>

  <rect x="650" y="410" width="130" height="42" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="715" y="437" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">Card</text>

  <rect x="790" y="410" width="140" height="42" rx="10" fill="#0b1220" stroke="#334155"/>
  <text x="860" y="437" font-size="13" font-weight="500" fill="#cbd5e1" text-anchor="middle">E-Wallet</text>

  <!-- Amount received -->
  <text x="510" y="486" font-size="10.5" font-weight="600" fill="#94a3b8" letter-spacing="0.4">AMOUNT RECEIVED</text>
  <rect x="510" y="494" width="420" height="46" rx="10" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="530" y="523" font-size="14" fill="#94a3b8">$</text>
  <text x="548" y="523" font-size="14" fill="#f1f5f9">100.00</text>

  <!-- Quick amount chips -->
  <rect x="510" y="552" width="66" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="543" y="569" font-size="11" fill="#cbd5e1" text-anchor="middle">Exact</text>

  <rect x="586" y="552" width="66" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="619" y="569" font-size="11" fill="#cbd5e1" text-anchor="middle">+10%</text>

  <rect x="662" y="552" width="66" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="695" y="569" font-size="11" fill="#cbd5e1" text-anchor="middle">100</text>

  <rect x="738" y="552" width="66" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
  <text x="771" y="569" font-size="11" fill="#cbd5e1" text-anchor="middle">150</text>

  <!-- Change -->
  <rect x="510" y="590" width="420" height="44" rx="10" fill="#052e16"/>
  <text x="530" y="617" font-size="12.5" fill="#4ade80">Change</text>
  <text x="912" y="617" font-size="14" font-weight="700" fill="#4ade80" text-anchor="end">34.00</text>

  <line x1="470" y1="660" x2="970" y2="660" stroke="#1e293b" stroke-width="1"/>

  <!-- Buttons -->
  <rect x="680" y="694" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="735" y="720" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">Cancel</text>

  <rect x="802" y="694" width="128" height="42" rx="10" fill="#16a34a"/>
  <text x="866" y="720" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Confirm Payment</text>
</svg>
